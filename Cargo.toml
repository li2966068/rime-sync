[workspace]
resolver = "2"
members = ["crates/core", "crates/cli"]
# src-tauri / src / packaging / scripts 由其他代理负责；它们未就绪时不参与构建。
exclude = ["src-tauri", "src", "packaging", "scripts", ".github"]

[workspace.package]
# 2026-11-10 起跟桌面端（src-tauri/tauri.conf.json）保持同一版本号。
# 之前这里一直是 0.1.0，导致 `rime-sync-cli --version` 显示 0.1.0，
# 和用户实际安装的 0.6.x 对不上（2026-11-10 修）。
version = "0.6.28"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
quick-xml = "0.38"
# socks：让 reqwest 能构造 socks5/socks5h 代理（0.6.8 代理支持）。
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "socks"] }
clap = { version = "4", features = ["derive"] }
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }