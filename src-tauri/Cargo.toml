[package]
name = "rime-sync-app"
version = "0.1.0"
description = "Rime 词库与配置 WebDAV 同步（桌面壳）"
edition = "2021"
rust-version = "1.77"
license = "MIT"

[lib]
name = "rime_sync_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rime-sync-core = { path = "../crates/core" }

[profile.release]
codegen-units = 1
panic = "abort"

[workspace]
