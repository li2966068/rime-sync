[package]
name = "rime-sync-app"
version = "0.7.0"
description = "Rime 词库与配置 WebDAV 同步（桌面壳）"
edition = "2021"
rust-version = "1.77"
license = "MIT"

[lib]
name = "rime_sync_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# custom-protocol 决定界面文件（dist）是「打进程序里」还是「从 devUrl 现场取」。
#
# Tauri v2 的坑：不带这个 feature 时是 **dev 模式** —— 程序里没有界面文件，
# 一跑就白屏，只有开发机上同时开着 vite 才有界面（2026-11-16 踩过：
# 本地 cargo build 出来的程序白屏，还误以为是自己代码的问题）。
#
# 默认打开 ⇒ cargo build --release 出来的桌面程序自带界面，拷到任何机器都能正常显示。
# 本地做前端开发时用 pnpm tauri dev：tauri-cli 会自动传 --no-default-features，
# 那时才是我们要的 dev 模式（改前端即时生效）。
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon：v2 的托盘在 tauri 本体里，feature 为 tray-icon（Linux 依赖 libayatana-appindicator3）。
# image-png：托盘图标从 PNG 解码（icons/32x32.png）。
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# 自动更新：与 tauri 2.12.4 对齐（插件 2.14.0 的 tauri 依赖为 ^2.12）。
# 前端调用前需在 <src-tauri>/capabilities 中补 "updater:default" 权限（由 UI 模块负责）。
tauri-plugin-updater = "2.14"
# 开机自启：2.7.0 的 tauri 依赖为 ^2.12，与 tauri 2.12.4 对齐（2.6.0 亦可，2.5.x 只要求 ^2.8.2）。
# 原生目录选择器（设置页 / 向导里的「浏览…」）。
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 输入方案管理：解析 *.schema.yaml 与改写 default.custom.yaml。
serde_yaml = "0.9"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rime-sync-core = { path = "../crates/core" }
tauri-plugin-single-instance = "2"
# 落盘日志：core 里的 tracing:: 调用（70 多处）此前在桌面端无处可去，
# 现在统一写进 <app_config_dir>/log.txt（与壳层的 push_log 同一个文件）。
# env-filter 让用户能用 RUST_LOG 调级别，默认 info。
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
# SPEC-4 §B4：瘦身。strip 去掉符号表，thin LTO 兼顾体积与构建时长，
# opt-level="s" 优先体积；codegen-units=1 让 LTO 发挥最大效果。
strip = true
lto = "thin"
codegen-units = 1
opt-level = "s"
panic = "abort"

[workspace]
