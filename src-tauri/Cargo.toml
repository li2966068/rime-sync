[package]
name = "rime-sync-app"
version = "0.6.25"
description = "Rime 词库与配置 WebDAV 同步（桌面壳）"
edition = "2021"
rust-version = "1.77"
license = "MIT"

[lib]
name = "rime_sync_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon：v2 的托盘在 tauri 本体里，feature 为 tray-icon（Linux 依赖 libayatana-appindicator3）。
# image-png：托盘图标从 PNG 解码（icons/32x32.png）。
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# 自动更新：与 tauri 2.12.4 对齐（插件 2.14.0 的 tauri 依赖为 ^2.12）。
# 前端调用前需在 <src-tauri>/capabilities 中补 "updater:default" 权限（由 UI 模块负责）。
tauri-plugin-updater = "2.14"
# 开机自启：2.7.0 的 tauri 依赖为 ^2.12，与 tauri 2.12.4 对齐（2.6.0 亦可，2.5.x 只要求 ^2.8.2）。
# 原生目录选择器（设置页 / 向导里的「浏览…」）。
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 输入方案管理：解析 *.schema.yaml 与改写 default.custom.yaml。
serde_yaml = "0.9"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rime-sync-core = { path = "../crates/core" }

[profile.release]
# SPEC-4 §B4：瘦身。strip 去掉符号表，thin LTO 兼顾体积与构建时长，
# opt-level="s" 优先体积；codegen-units=1 让 LTO 发挥最大效果。
strip = true
lto = "thin"
codegen-units = 1
opt-level = "s"
panic = "abort"

[workspace]
