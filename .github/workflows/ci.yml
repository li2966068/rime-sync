name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  NODE_VERSION: "22"

jobs:
  rust:
    name: rust · fmt / clippy / test
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: rust cache
        uses: swatinem/rust-cache@v2

      - name: install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test --workspace
        run: cargo test --workspace --all-targets

  # 护栏：发布出去的 CLI 二进制必须与当前源码一致。
  #
  # 为什么不直接 grep 二进制里的字符串：Rust/LLVM 会把短字符串常量拆成 8 字节
  # 立即数内嵌进指令流（not-managed 实际存成 not-mana + aged），字节搜索查不到
  # **不能证明**没有，所以那种断言既会漏报也会误报。
  # scripts/ci/assert-cli-matches-source.sh 改用三样可靠的东西：
  #   1. --version 的版本号 == Cargo.toml 的 workspace 版本；
  #   2. nm -C 的符号名（当前源码才有的函数）；
  #   3. 真的跑一次二进制，检查 check-ime 的 JSON 输出对不对。
  cli-matches-source:
    name: cli · 发布二进制与源码一致
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: rust cache
        uses: swatinem/rust-cache@v2

      - name: install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev

      - name: build CLI (release)
        run: cargo build -p rime-sync-cli --release --locked

      - name: assert CLI matches source
        run: bash scripts/ci/assert-cli-matches-source.sh target/release/rime-sync-cli

  # CI 防回归：Windows 专属代码（cfg(windows)）每次 push/PR 都过一遍 cargo check。
  #
  # 目标平台用 x86_64-pc-windows-gnu 而不是 msvc：core → reqwest → rustls → ring
  # 的 build.rs 用 cc-rs 编译 C，msvc 目标需要 MSVC 的 lib.exe（ubuntu runner 上没有；
  # 本机实测报错：`error occurred in cc-rs: failed to find tool "lib.exe"`）。
  # gnu 目标的 target_os 同样是 windows，而 cargo check 不链接，所以对「Windows 专属
  # 代码能否编过」等价；mingw 的 gcc 只用来编 ring 的 C。结论见
  # docs/PREBUILT-BOOTSTRAP.md §13.7。
  windows-typecheck:
    name: windows · cargo check（core + cli）
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: windows-typecheck

      - name: install mingw（只为编 ring 的 C）
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: cargo check · rime-sync-core
        run: cargo check -p rime-sync-core --target x86_64-pc-windows-gnu

      - name: cargo check · rime-sync-cli
        run: cargo check -p rime-sync-cli --target x86_64-pc-windows-gnu

  # 0.6.23：判据 / 修补 / 报告一致性在真实 Windows 上验一遍（不装输入法、不需要 librime）。
  # 断言全部从 JSON 报告里取字段（PowerShell ConvertFrom-Json），不解析 stdout 文本。
  windows-e2e:
    name: windows · e2e（ensure-ime 判据 / 修补 / 失败退出码）
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      # 0.6.25：Windows runner 的 git 默认 core.autocrlf=true，checkout 会把仓库里的
      # LF 文本转成 CRLF；随包产物的 MANIFEST.json 记的是 sha256，于是立刻对不上
      # （v0.6.24 真机 copy_failed=11，v0.6.25 发布产物校验失败）。
      # 这里就地断言 checkout 之后随包产物逐字节没变 —— 失败要发生在打包之前。
      - name: payload eol check（checkout 后逐字节校验）
        shell: bash
        run: bash .github/scripts/check-rime-payload-eol.sh

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: windows-e2e

      - name: build cli
        run: cargo build -p rime-sync-cli --locked

      # B 方案：安装器只交付程序本体，输入法在程序首次启动时自举。
      # 这一条模拟「装完后第一次启动程序」：--mode install 必须给出 result=ok，
      # 且铺进去的 build 是我们这套（schema 含 rimesync_vnum）。
      - name: e2e · 模拟装完后首次启动（ensure-ime --mode install）
        shell: pwsh
        run: ./.github/scripts/e2e-windows-first-start.ps1

      # 只伪造 user dir + payload：验证判据（assess）、修补（补缺失的 bin）与报告字段。
      - name: e2e · ensure-ime / check-ime
        shell: pwsh
        run: ./.github/scripts/e2e-windows-ime.ps1

      - name: upload e2e json reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ime-e2e
          path: ${{ runner.temp }}/rime-sync-*
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: frontend · tsc --noEmit
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: type check
        run: pnpm exec tsc --noEmit

  # 断言脚本自检：用合成产物证明"少一个功能入口就会红"。
  # 真实产物验收在 release.yml 的 verify-artifacts job（那里才有 deb / setup.exe）；
  # 这里每次 push/PR 都跑，成本约 20 秒（无需编译）。
  verify-artifacts:
    name: verify-artifacts · 断言脚本自检
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: verifier selftest
        run: bash .github/scripts/verify-artifacts.sh --selftest

  e2e:
    name: e2e · rclone webdav transport
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone curl pkg-config libdbus-1-dev

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: rust cache
        uses: swatinem/rust-cache@v2

      - name: build cli
        run: cargo build -p rime-sync-cli --locked

      - name: transport x2 (幂等 + userdb 红线)
        run: bash .github/scripts/e2e-rclone.sh

  e2e-dav:
    name: e2e · dav 两台设备（test-conn / transport / apply / 冲突副本）
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install rclone
        run: |
          sudo apt-get update
          # pkg-config/libdbus-1-dev：keyring 依赖，缺了 cargo build 起不来（与 rust job 一致）。
          sudo apt-get install -y rclone curl python3 pkg-config libdbus-1-dev

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: rust cache
        uses: swatinem/rust-cache@v2

      - name: build cli
        run: cargo build -p rime-sync-cli --locked

      # runner 上没有 librime：apply 的 deploy 阶段脚本按 SKIP 处理，硬校验的是 transport 阶段。
      - name: dav e2e (两台设备 + 冲突副本)
        env:
          E2E_WORK_DIR: ${{ runner.temp }}
          RIME_SYNC_CLI: ${{ github.workspace }}/target/debug/rime-sync-cli
        run: bash scripts/e2e/dav-e2e.sh

      - name: upload e2e logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dav-e2e-logs
          path: |
            ${{ runner.temp }}/rime-sync-dav-e2e.*/rclone.log
            ${{ runner.temp }}/rime-sync-dav-e2e.*/*.json
            ${{ runner.temp }}/rime-sync-dav-e2e.*/*.err
            ${{ runner.temp }}/rime-sync-dav-e2e.*/e2e-dev*/log.txt
          if-no-files-found: ignore
          retention-days: 7

  packaging-scripts:
    name: packaging · vendor 脚本存在性 / 语法
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@v4

      # 只做静态校验：脚本会下载几十 MB 的 vendor 资源 / 跑 docker 构建，不在 CI 里真跑。
      - name: packaging scripts exist
        run: |
          set -euo pipefail
          missing=0
          for f in \
            scripts/ime/build-linux.sh \
            scripts/ime/container-build.sh \
            scripts/ime/package-ime-deb.sh \
            scripts/ime/fetch-vendor-deps.sh \
            scripts/ime/build-fcitx5-addon.sh \
            scripts/ime/Dockerfile \
            packaging/linux/build-offline-installer.sh \
            packaging/linux/prepare-sync-deb.sh \
            packaging/linux/verify-offline.sh \
            packaging/linux/install.sh \
            packaging/linux/install-vendor-deps.sh \
            packaging/linux/fetch-vendor-debs.sh \
            packaging/linux/postinst \
            packaging/linux/prerm \
            packaging/linux/postrm \
            packaging/linux/test/Dockerfile \
            packaging/linux/test/verify-in-container.sh \
            packaging/windows/fetch-weasel.ps1 \
            scripts/ime/build-librime-win.ps1 \
            scripts/ime/build-weasel.ps1 \
            scripts/ime/verify-win-build-cache.ps1 \
            scripts/ime/librime-build-cache.sh; do
            [ -f "$f" ] || { echo "::error::缺少 $f"; missing=1; }
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: bash -n every packaging shell script
        run: |
          set -euo pipefail
          mapfile -t files < <(find scripts/ime scripts/e2e packaging/linux .github/scripts -maxdepth 2 -type f -name '*.sh' | sort)
          printf '%s\n' "${files[@]}"
          for f in "${files[@]}"; do bash -n "$f"; done
          echo "bash -n OK: ${#files[@]} 个脚本"


      # postinst 必须按 fcitx5-rime 的 UserDataDirPath 解析 Rime 用户目录：
      # 硬编码 ~/.local/share/fcitx5/rime 会把受管 custom.yaml 与预编译产物
      # seed 到没人读的目录，用户真正在用的目录反而缺文件（切不到五笔）。
      - name: postinst resolves the real Rime user dir
        run: |
          set -euo pipefail
          bash packaging/linux/test/test-postinst-rime-dir.sh
          if grep -q 'RIME_USER_DIR=\$TARGET_HOME/\.local/share/fcitx5/rime' packaging/linux/postinst; then
            echo "::error::postinst 不得硬编码 Rime 用户目录，必须走 resolve_rime_user_dir"
            exit 1
          fi
          grep -q 'resolve_rime_user_dir' packaging/linux/postinst || {
            echo "::error::postinst 缺少 resolve_rime_user_dir"
            exit 1
          }

      # 改名 / 删步 / 换顺序时这里立刻红：离线安装器静默缺席比构建失败更难查。
      - name: release.yml + offline-verify.yml still wire the offline pipeline
        run: |
          set -euo pipefail
          for wf in .github/workflows/release.yml .github/workflows/offline-verify.yml; do
            for f in scripts/ime/build-linux.sh scripts/ime/fetch-vendor-deps.sh packaging/linux/build-offline-installer.sh; do
              grep -qF "$f" "$wf" || { echo "::error::$wf 未引用 $f"; exit 1; }
            done
          done
          grep -qF packaging/linux/verify-offline.sh .github/workflows/offline-verify.yml || {
            echo "::error::offline-verify.yml 未调用 packaging/linux/verify-offline.sh"
            exit 1
          }

      # 0.6.9：Windows 版必须自建 librime（合并 plugins/rimesync-extra）。谁把它改回预编译包，
      # 这里立刻红 —— 上游预编译包没有外部插件加载能力，v 模式 / 标点 Shift 备选 / a-h 选词
      # 会静默失效（0.6.8 的 Windows 包就是这个状态，只有标点直出靠配置生效）。
      - name: guard · windows builds librime from vendored source
        run: |
          set -euo pipefail
          wf=.github/workflows/release.yml
          ws=scripts/ime/build-weasel.ps1
          lb=scripts/ime/build-librime-win.ps1

          [ -f "$lb" ] || { echo "::error::缺少 $lb"; exit 1; }
          grep -qF 'scripts/ime/build-librime-win.ps1' "$wf" ||
            { echo "::error::$wf 没有调用 $lb（Windows 会退回不含插件的预编译 librime）"; exit 1; }
          grep -qF -- '-LibrimeSource self' "$wf" ||
            { echo "::error::$wf 编 Weasel 时没显式传 -LibrimeSource self"; exit 1; }
          grep -qF 'assert rime.dll carries rimesync components' "$wf" ||
            { echo "::error::$wf 没有「解出最终 rime.dll 查组件名」的断言步骤"; exit 1; }

          # 静默回退：release.yml 不许再传 -LibrimeTag（那会拉官方 1.13.1，一个插件都没有）
          if grep -qF -- '-LibrimeTag' "$wf"; then
            echo "::error::$wf 仍传 -LibrimeTag：Windows 版会退回不含插件的预编译 librime"
            exit 1
          fi
          # build-weasel.ps1 侧：默认必须是 self；预编译只能靠显式 -LibrimeSource prebuilt
          grep -qF "[ValidateSet('self', 'prebuilt')]" "$ws" ||
            { echo "::error::$ws 的 -LibrimeSource 没有 ValidateSet(self|prebuilt)"; exit 1; }
          grep -qF "[string]\$LibrimeSource = 'self'" "$ws" ||
            { echo "::error::$ws 的 -LibrimeSource 默认值不是 self"; exit 1; }
          if grep -qE "LibrimeTag\s*=\s*'[0-9]" "$ws"; then
            echo "::error::$ws 给 -LibrimeTag 设了默认值：预编译包会被静默使用"
            exit 1
          fi
          for f in "$ws" "$lb"; do
            grep -qF 'rimesync_vnum' "$f" || { echo "::error::$f 没有 rimesync_vnum 组件断言"; exit 1; }
          done

          # 产物侧：verify-artifacts 必须能从 setup.exe 解出的 rime.dll 里断言组件名
          # 0.6.26：numpad（小键盘组件）也必须被断言 —— 以前只查三个 rimesync-* 组件。
          for n in rimesync_vnum rimesync_punct numpad; do
            grep -qF "$n" .github/scripts/verify-artifacts.sh ||
              { echo "::error::verify-artifacts.sh 没有断言 $n"; exit 1; }
          done
          grep -qF 'check_rime_components' .github/scripts/verify-artifacts.sh ||
            { echo "::error::verify-artifacts.sh 缺少 check_rime_components（Windows 断言入口）"; exit 1; }
          # Linux 侧守卫入口：rime-inputmethod deb 里的 librime.so 组件检查
          grep -qF 'check_librime_components' .github/scripts/verify-artifacts.sh ||
            { echo "::error::verify-artifacts.sh 缺少 check_librime_components（Linux 组件断言入口）"; exit 1; }
          echo "guard OK：release.yml -> build-librime-win.ps1 -> rime.dll 组件断言的链路完整"

      # 构建缓存只在「命中后必须校验」的前提下安全：删掉 verify 步骤、换掉 key、或者去掉
      # manifest 写入，都会让坏缓存静默进发布包（或者让缓存永远不命中）。
      - name: guard · release.yml keeps the ime build-cache verification wired
        run: |
          set -euo pipefail
          wf=.github/workflows/release.yml
          for f in scripts/ime/verify-win-build-cache.ps1 scripts/ime/librime-build-cache.sh; do
            grep -qF "$f" "$wf" || { echo "::error::$wf 没有引用 $f"; exit 1; }
          done
          grep -qF 'scripts/ime/verify-win-build-cache.ps1 -Mode verify' "$wf" ||
            { echo "::error::$wf 没有在 cache 恢复后跑 verify（坏缓存会直接进包）"; exit 1; }
          grep -qF 'scripts/ime/verify-win-build-cache.ps1 -Mode write' "$wf" ||
            { echo "::error::$wf 没有在构建后写 manifest（缓存永远不命中）"; exit 1; }
          grep -qF "hashFiles('third_party/librime/**')" "$wf" ||
            { echo "::error::$wf 的缓存 key 不含 third_party/librime/**"; exit 1; }
          grep -qF 'cache=hit' "$wf" || { echo "::error::$wf 不会打印 cache=hit"; exit 1; }
          grep -qF 'cache=invalid reason=' "$wf" || { echo "::error::$wf 不会打印 cache=invalid reason=…"; exit 1; }
          # 0.6.23：restore 用内容指纹、save 用「指纹-run_id」。同一个 key 存第二次会
          # unable to reserve cache，判 invalid 后重建的产物就永远存不回去（见 docs/CI-CACHE.md）。
          grep -qF 'RIME_CACHE_KEY_RESTORE' "$wf" ||
            { echo "::error::$wf 没有把 restore 用的 key 写进 RIME_CACHE_KEY_RESTORE"; exit 1; }
          grep -qF 'RIME_CACHE_KEY_SAVE' "$wf" ||
            { echo "::error::$wf 没有把 save 用的 key 写进 RIME_CACHE_KEY_SAVE"; exit 1; }
          grep -qF 'github.run_id' "$wf" ||
            { echo "::error::$wf 的 save key 没带 run_id（exact key 命中且判 invalid 时产物存不回去）"; exit 1; }
          grep -qF 'cache=saved key=' "$wf" ||
            { echo "::error::$wf 不会打印 cache=saved key=<save key>"; exit 1; }
          # Linux ime job 的 save 只在真重建时发生，靠 build-linux.sh 把 cache_status 转成 output。
          grep -qF 'cache_status' scripts/ime/build-linux.sh ||
            { echo "::error::scripts/ime/build-linux.sh 不再输出 cache_status（Linux 缓存永远存不回去）"; exit 1; }
          grep -qF 'cache_status' "$wf" ||
            { echo "::error::$wf 的 ime save 步没有按 cache_status 判断"; exit 1; }
          echo "guard OK：缓存 -> 校验 -> manifest -> 保存 的链路完整，restore/save key 已分开"

      # 0.6.23：#8 deb 里的 /usr/bin/rime-sync-cli 只能有一个来源（bundle.externalBin
      # sidecar）。deb.files 再映射一次就是双供：两条路写同一个路径，谁赢取决于
      # tauri-bundler 内部顺序，产物里一旦变成两份就没人说得清装进去的是哪个。
      - name: guard · rime-sync-cli comes from the sidecar only
        run: |
          set -euo pipefail
          conf=src-tauri/tauri.conf.json
          wf=.github/workflows/release.yml
          va=.github/scripts/verify-artifacts.sh
          cli=/usr/bin/rime-sync-cli
          if grep -qF '"/usr/bin/rime-sync-cli"' "$conf"; then
            echo "::error::$conf 的 bundle.linux.deb.files 又映射了 /usr/bin/rime-sync-cli（与 sidecar 双供）"
            exit 1
          fi
          grep -qF '"externalBin"' "$conf" ||
            { echo "::error::$conf 没有 bundle.externalBin（CLI 会从 deb/AppImage 里消失）"; exit 1; }
          grep -qF 'target/release/rime-sync-cli' "$conf" ||
            { echo "::error::$conf 的 externalBin 不是 rime-sync-cli"; exit 1; }
          grep -qF 'rime-sync-cli x1' "$wf" ||
            { echo "::error::$wf 没有断言 deb 内 /usr/bin/rime-sync-cli 恰好 1 份"; exit 1; }
          grep -qF 'SYNC_CLI' "$va" ||
            { echo "::error::$va 没有校验 deb 内 $cli 恰好 1 份"; exit 1; }
          grep -qF 'assert_one_cli' packaging/linux/prepare-sync-deb.sh ||
            { echo "::error::packaging/linux/prepare-sync-deb.sh 没有断言 CLI 恰好 1 份"; exit 1; }
          echo "guard OK：CLI 唯一来源 = bundle.externalBin sidecar，deb 侧断言恰好 1 份"

      # ps1 在 ubuntu runner 上不能执行，但可以解析：语法错误不必等 windows job 首跑才发现。
      # 本机没有 pwsh（改脚本的人也不一定有），所以这一段是唯一的「改完就能验」的入口。
      - name: parse Windows packaging ps1 (syntax only)
        run: |
          set -euo pipefail
          files=$(find scripts/ime packaging/windows .github/scripts -maxdepth 1 -type f -name '*.ps1' | sort)
          [ -n "$files" ] || { echo "::error::没找到任何 Windows 打包 ps1"; exit 1; }
          printf '%s\n' "$files"
          if ! command -v pwsh >/dev/null 2>&1; then
            echo "pwsh 不在 PATH：跳过 ps1 解析（GitHub 的 ubuntu-22.04 镜像自带 PowerShell 7）"
            exit 0
          fi
          for f in $files; do
            pwsh -NoProfile -Command "\$e=\$null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '$f').Path, [ref]\$null, [ref]\$e) | Out-Null; if (\$e) { \$e | ForEach-Object { Write-Host ('  ' + \$_.Extent.StartLineNumber + ': ' + \$_.Message) }; exit 1 }" ||
              { echo "::error::$f 语法解析失败"; exit 1; }
            echo "  ok  $f"
          done

      # buildkit 只接受 default/host/none：docker build 传 bridge 会直接失败（上一轮 CI 的真实炸点）。
      # docker run 的网络探测（DOCKER_NETWORK=bridge/host）不受影响。
      - name: guard · docker build must not use --network bridge
        run: |
          set -euo pipefail
          bad=0
          # ci.yml 自身带着这些模式文本，排除掉避免自己匹配自己。
          if grep -rnIE --exclude=ci.yml 'docker[[:space:]]+build[^#]*--network[=[:space:]]+"?bridge' \
               scripts packaging .github/workflows; then
            echo "::error::docker build 传了 --network bridge（buildkit 只接受 default/host/none）"
            bad=1
          fi
          if grep -rnIE --exclude=ci.yml 'docker[[:space:]]+build[^#]*DOCKER_NETWORK' \
               scripts packaging .github/workflows; then
            echo "::error::docker build 复用了 docker run 的探测变量 DOCKER_NETWORK（可能是 bridge）"
            bad=1
          fi
          exit $bad

      # 矩阵 + 汇总 job + publish 依赖：trixie 的两个安装器缺席就不能发布。
      - name: guard · release.yml matrix / verify-artifacts / publish needs
        run: |
          set -euo pipefail
          wf=.github/workflows/release.yml
          for job in linux-app ime windows verify-artifacts publish; do
            grep -qE "^  ${job}:" "$wf" || { echo "::error::$wf 缺少 job $job"; exit 1; }
          done
          grep -qE '^    strategy:' "$wf" || { echo "::error::$wf 的 ime job 没有 matrix"; exit 1; }
          # 0.6.6 起 Linux 只编译 trixie：矩阵只能有 debian-13，旧发行版残留要立刻抓出来。
          grep -qF '          - distro: debian-13' "$wf" ||
            { echo "::error::$wf 的 matrix 缺少 debian-13"; exit 1; }
          for d in ubuntu-22.04 ubuntu-24.04 debian-12; do
            if grep -qF "          - distro: $d" "$wf"; then
              echo "::error::$wf 的 matrix 仍含 $d：Linux 只编译 trixie"
              exit 1
            fi
          done
          # 离线 + 在线两个安装器都要组装、都要断言；独立 IME deb 不再上传。
          # 两个包都自带完整输入法，区别只在依赖库：离线包把依赖打包在内（断网可装），在线包安装时联网下载依赖。
          grep -qF 'build-offline-installer.sh --both' "$wf" ||
            { echo "::error::$wf 没有组装 offline + online 两个安装器"; exit 1; }
          grep -qF '.online.run' "$wf" ||
            { echo "::error::$wf 没有在线安装包（--both 之外未见 .online.run）"; exit 1; }
          grep -qF 'rime-sync-installer_' packaging/linux/build-offline-installer.sh ||
            { echo "::error::build-offline-installer.sh 不产出 rime-sync-installer_*.run"; exit 1; }
          if grep -qE '^ *gh release upload .*rime-inputmethod' "$wf"; then
            echo "::error::$wf 仍把 rime-inputmethod deb 当独立资产上传"
            exit 1
          fi
          grep -qF 'matrix.image' "$wf" || { echo "::error::$wf 没把 matrix.image 传给 IMAGE"; exit 1; }
          grep -qF 'IMAGE: ' "$wf" || { echo "::error::$wf 的 ime job 没有 IMAGE 环境变量"; exit 1; }
          for f in "bash scripts/ime/build-linux.sh" 'fetch-vendor-deps.sh "$DISTRO"' 'build-offline-installer.sh --both "$DISTRO"'; do
            grep -qF "$f" "$wf" || { echo "::error::$wf 未按发行版调用 $f"; exit 1; }
          done
          ime_needs=$(awk '/^  ime:/{f=1;next} f&&/^    needs:/{print;exit}' "$wf")
          case "$ime_needs" in
            *linux-app*) : ;;
            *) echo "::error::ime job 必须 needs: linux-app（否则拿不到 rime-sync deb）"; exit 1 ;;
          esac
          pub_needs=$(awk '/^  publish:/{f=1;next} f&&/^    needs:/{print;exit}' "$wf")
          # 0.6.24：collect job 已并入 verify-artifacts（它在 GitHub 侧每次都 2 秒零步骤失败）。
          # publish 必须等 verify-artifacts（它 needs ime）和 windows，缺任一都不发布。
          for j in verify-artifacts windows; do
            case "$pub_needs" in
              *"$j"*) : ;;
              *) echo "::error::publish 必须 needs $j（保证任一发行版失败就不发布）"; exit 1 ;;
            esac
          done
          va_needs=$(awk '/^  verify-artifacts:/{f=1;next} f&&/^    needs:/{print;exit}' "$wf")
          case "$va_needs" in
            *ime*) : ;;
            *) echo "::error::verify-artifacts 必须 needs: ime（否则拿不到在线安装包）"; exit 1 ;;
          esac
          # deb 必须先下载到 packaging/out/ 再抓依赖闭包
          awk '/^  ime:/{f=1} /^  windows:/{f=0} f' "$wf" > /tmp/ime_job.yml
          # 产物来源已经从 workflow artifact 换成草稿 Release（gh release download）。
          dl=$(grep -n 'gh release download' /tmp/ime_job.yml | head -n 1 | cut -d: -f1 || true)
          fv=$(grep -n 'fetch-vendor-deps.sh "$DISTRO"' /tmp/ime_job.yml | head -n 1 | cut -d: -f1 || true)
          if [ -z "$dl" ] || [ -z "$fv" ] || [ "$dl" -ge "$fv" ]; then
            echo "::error::ime job 里 gh release download（第 ${dl:-?} 行）必须先于 fetch-vendor-deps（第 ${fv:-?} 行）"
            exit 1
          fi
      # 资产清单断言逻辑自检（.github/scripts/assert-release-assets.sh）：
      # 用假清单证明「trixie 离线 + 在线两个 .run + 0 个独立 IME deb」才通过，
      # 而旧的四发行版 + 独立 IME deb 清单必须失败。
      - name: guard · release asset inventory assertions
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          ver=0.0.0
          cat >"$tmp/good.txt" <<EOF
          rime-sync_0.0.0_amd64.AppImage 110295544
          rime-sync_0.0.0_amd64.AppImage.sig 440
          rime-sync_0.0.0_amd64.deb 3571090
          rime-sync-installer_0.0.0.trixie.offline.run 184499458
          rime-sync-installer_0.0.0.trixie.online.run 6900000
          rime-sync_0.0.0_x64-setup.exe 14000000
          rime-sync_0.0.0_x64-setup.exe.sig 440
          rime-sync_0.0.0_x64-offline-setup.exe 150000000
          rime-sync_0.0.0_x64-offline-setup.exe.sig 440
          EOF
          bash .github/scripts/assert-release-assets.sh --assets "$tmp/good.txt" --version "$ver"

          # 旧清单：四个发行版各一个 .run + 四个独立 IME deb，必须被断言拒绝。
          cat >"$tmp/bad.txt" <<EOF
          rime-sync_0.0.0_amd64.AppImage 110295544
          rime-sync_0.0.0_amd64.AppImage.sig 440
          rime-sync_0.0.0_amd64.deb 3571090
          rime-sync-installer_0.0.0.jammy.run 135548197
          rime-sync-installer_0.0.0.noble.run 147344106
          rime-sync-installer_0.0.0.bookworm.run 173381663
          rime-sync-installer_0.0.0.trixie.offline.run 184499458
          rime-inputmethod_0.0.0.jammy_amd64.deb 3156512
          rime-inputmethod_0.0.0.noble_amd64.deb 3272312
          rime-inputmethod_0.0.0.bookworm_amd64.deb 3171772
          rime-inputmethod_0.0.0.trixie_amd64.deb 3254204
          rime-sync_0.0.0_x64-setup.exe 14000000
          rime-sync_0.0.0_x64-setup.exe.sig 440
          rime-sync_0.0.0_x64-offline-setup.exe 150000000
          rime-sync_0.0.0_x64-offline-setup.exe.sig 440
          EOF
          if bash .github/scripts/assert-release-assets.sh --assets "$tmp/bad.txt" --version "$ver"; then
            echo "::error::旧资产清单（四发行版 + 独立 IME deb）竟然通过了断言"
            exit 1
          fi
          rm -rf "$tmp"
          echo "资产清单断言自检 OK"

      - name: legacy flat vendor fetch stays out of release.yml
        run: |
          set -euo pipefail
          if grep -qE '^ *bash packaging/linux/fetch-vendor-debs.sh' .github/workflows/release.yml; then
            echo "::error::release.yml 又跑回了旧的扁平 vendor 抓取（packaging/linux/fetch-vendor-debs.sh）：与四发行版 vendor/<distro>/ 布局冲突"
            exit 1
          fi

      # 新的真实 WebDAV e2e 不能悄悄掉线：job 在 → 脚本被调用 → push/PR 都触发。
      - name: guard · ci.yml keeps the dav e2e wired on push + pull_request
        run: |
          set -euo pipefail
          wf=.github/workflows/ci.yml
          grep -qE '^  e2e-dav:' "$wf" || { echo "::error::$wf 缺少 e2e-dav job"; exit 1; }
          grep -qF 'bash scripts/e2e/dav-e2e.sh' "$wf" || { echo "::error::$wf 未调用 scripts/e2e/dav-e2e.sh"; exit 1; }
          [ -x scripts/e2e/dav-e2e.sh ] || { echo "::error::scripts/e2e/dav-e2e.sh 不存在或不可执行"; exit 1; }
          for trigger in push pull_request; do
            grep -qE "^  ${trigger}:" "$wf" || { echo "::error::ci.yml 的 on: 缺少 ${trigger}（该 e2e 必须在 push/PR 都跑）"; exit 1; }
          done
          echo "dav e2e 接线 OK"

      # v0.6.0 事故防线（docs/FALLBACK-POLICY.md）：Weasel 回退必须显式、可见、可关闭。
      - name: guard · weasel fallback is explicit and visible
        run: |
          set -euo pipefail
          wf=.github/workflows/release.yml
          test -f docs/FALLBACK-POLICY.md || { echo "::error::缺少 docs/FALLBACK-POLICY.md"; exit 1; }
          grep -qF 'FALLBACK-POLICY.md' packaging/README.md || {
            echo "::error::packaging/README.md 没有引用 docs/FALLBACK-POLICY.md"
            exit 1
          }
          grep -qE '^  verify-artifacts:' "$wf" || { echo "::error::$wf 缺少 verify-artifacts job"; exit 1; }
          grep -qE '^  verify-artifacts:' .github/workflows/ci.yml || {
            echo "::error::ci.yml 缺少 verify-artifacts job（断言脚本自检必须在 push/PR 就跑）"
            exit 1
          }
          grep -qF 'verify-artifacts.sh --selftest' .github/workflows/ci.yml || {
            echo "::error::ci.yml 没有跑 verify-artifacts.sh --selftest"
            exit 1
          }
          grep -qF 'verify-artifacts.sh' "$wf" || {
            echo "::error::$wf 没有调用 .github/scripts/verify-artifacts.sh"
            exit 1
          }
          pub_needs=$(awk '/^  publish:/{f=1;next} f&&/^    needs:/{print;exit}' "$wf")
          case "$pub_needs" in
            *verify-artifacts*) : ;;
            *) echo "::error::publish 必须 needs verify-artifacts（断言失败就不许发布）"; exit 1 ;;
          esac
          grep -qF 'weasel_mode:' "$wf" || {
            echo "::error::$wf 的 workflow_dispatch 没有 weasel_mode 选项（回退必须可显式选择）"
            exit 1
          }
          grep -qF 'mode=require' "$wf" || {
            echo "::error::$wf 没有把 tag 推送解析成 require（自编译失败必须让 job 失败）"
            exit 1
          }
          # 这里刻意不写完整的表达式字面量：run 块里的表达式会被 GitHub 求值。
          grep -qF 'steps.weasel_mode.outputs.mode' "$wf" || {
            echo "::error::$wf 的 Weasel 自编译步骤必须按模式决定 continue-on-error（不能写死 true）"
            exit 1
          }
          if grep -nE '^ *continue-on-error: true' "$wf" | grep -qv 'weasel_mode'; then
            echo "::error::$wf 里还有写死 continue-on-error: true 的步骤（会静默吞掉失败）"
            exit 1
          fi
          grep -qF '本版未包含 Weasel 入口' "$wf" || {
            echo "::error::$wf 没有在回退时红字标注「本版未包含 Weasel 入口」"
            exit 1
          }
          echo "weasel fallback 接线 OK"

      # 开发机没有 pwsh 时，release.yml 里的内联 PowerShell 只能靠这里兜住：
      # 把每个 shell: pwsh 的 run 块抽出来，用 runner 自带的 pwsh 逐个做语法解析。
      - name: parse inline PowerShell in release.yml
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import os
          import yaml

          for stale in glob.glob('/tmp/inline-*.ps1'):
              os.remove(stale)
          import re
          doc = yaml.safe_load(open('.github/workflows/release.yml'))
          index = 0
          for job in doc['jobs'].values():
              for step in job.get('steps', []):
                  if step.get('shell') == 'pwsh' and 'run' in step:
                      index += 1
                      # GitHub 的双花括号表达式是**运行时**由 Actions 替换的：
                      # 抽出来的原文里它不是合法 PowerShell（双花括号会被解析成
                      # 「变量名里出现了 {」）。先把表达式换成占位符再解析，块里其余
                      # 的语法照样能查出来 —— 不能整段跳过。
                      # 注意：注释里**不能**出现字面的双花括号 —— run 块里的表达式
                      # 会被 Actions 求值，注释里的花括号是非法表达式，整个 workflow
                      # 会直接「failed because of a workflow file issue」。
                      body = re.sub(r'\$\{\{.*?\}\}', 'PLACEHOLDER', step['run'])
                      with open(f'/tmp/inline-{index}.ps1', 'w') as handle:
                          handle.write(body)
          print(f'extracted {index} inline pwsh steps')
          PY
          cat >/tmp/parse-pwsh.ps1 <<'PS1'
          param([string]$Path)
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($Path, [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host "::error file=$Path::$($_.Message)" }
            exit 1
          }
          PS1
          shopt -s nullglob
          files=(/tmp/inline-*.ps1)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::release.yml 里没有抽到任何 shell: pwsh 步骤（守卫失效）"
            exit 1
          fi
          for f in "${files[@]}"; do
            pwsh -NoProfile -File /tmp/parse-pwsh.ps1 "$f"
            echo "pwsh syntax ok: $f"
          done

      - name: parse packaging/windows/fetch-weasel.ps1
        run: |
          pwsh -NoProfile -Command '
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile("packaging/windows/fetch-weasel.ps1", [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host "::error::$_" }
              exit 1
            }
            Write-Host "fetch-weasel.ps1 语法 OK"
          '

  # M4：B 方案的核心契约是「安装器不碰输入法」。这个 job 把契约变成会失败的门：
  #   ① --strict 真编译两套钩子（Ubuntu 装 nsis）；② 变异测试把真实 Weasel 安装调用
  #   插回 PREINSTALL，必须立刻变红 —— 否则断言就是空转的。
  nsis-hooks:
    name: windows · NSIS 钩子静态断言 + 变异测试
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install nsis（makensis）
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y nsis
          makensis -VERSION

      - name: check-nsis-hooks --strict
        run: bash packaging/windows/check-nsis-hooks.sh --strict

      - name: mutation test（真实安装调用插回 PREINSTALL 必须变红）
        run: bash packaging/windows/test-nsis-hooks-negative.sh

      # 0.6.24：预编译产物清单以前**从没**在 CI 里校验过 —— 清单与磁盘不一致
      # （少文件、体积对不上、方案标记缺失）只能等打包时才炸。
      - name: prebuilt manifest check
        run: python3 scripts/ime/gen-prebuilt-build.py --check

      # config 模板只能有一份源：手写源与分发副本漂移 = 用户拿到两套配置。
      - name: config sources check
        run: bash packaging/windows/check-config-sources.sh

      # 0.6.26：方案模板必须带 numpad —— 用户目录里那份旧 custom.yaml 缺了它，
      # 就会把 data 方案里的 numpad 整段顶掉（小键盘数字键失效的根因）。
      # 以前**从没**在 CI 里校验过模板内容，只能等用户在真机上才发现。
      # 这个检查只读模板，不写任何文件。
      - name: schema custom template check
        run: python3 scripts/ime/gen-schema-custom.py --check

  # 0.6.24：NSIS 钩子的**运行期**冒烟 —— wine 跑的就是发布用的那个 Windows
  # 二进制（NSIS stub + 钩子），验的是静态断言看不出来的东西：静默安装/卸载的
  # 退出码、/PURGEDATA 有没有生效、两条用户数据目录删没删、卸载日志写没写全。
  # 0.6.24 就是靠这一步抓到「日志追加语义坏掉、只剩最后一行」的。
  nsis-smoke:
    name: windows · NSIS 钩子 wine 冒烟
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install nsis + wine
        run: |
          set -uo pipefail
          sudo dpkg --add-architecture i386 || true
          sudo apt-get update
          sudo apt-get install -y nsis
          sudo apt-get install -y wine || sudo apt-get install -y wine64 || true
          makensis -VERSION
          wine --version || true

      # wine 装不上 / 跑不了 32 位程序时跳过（不阻塞 CI），但要留痕。
      - name: preflight · wine 可用性
        run: |
          set -uo pipefail
          if ! command -v wine >/dev/null 2>&1; then
            echo "::notice::wine 不可用，跳过 wine 冒烟"
            echo "SKIP_WINE=1" >> "$GITHUB_ENV"
            exit 0
          fi
          if ! WINEPREFIX="$RUNNER_TEMP/wine-preflight" WINEDEBUG=-all wine cmd /c echo ok >/dev/null 2>&1; then
            echo "::notice::wine 跑不了 32 位程序，跳过 wine 冒烟"
            echo "SKIP_WINE=1" >> "$GITHUB_ENV"
          fi

      - name: wine smoke（静默安装 + 静默卸载 + 用户数据清理）
        if: env.SKIP_WINE != '1'
        run: bash packaging/windows/test-nsis-hooks-wine.sh --strict
