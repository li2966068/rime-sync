name: release

# 触发：推送 v* tag，或手动指定一个 tag。
# 产物：
#   linux   → deb + AppImage（+ .sig）
#   windows → NSIS 安装包 + 便携版 zip（+ 更新包 .sig）
#
# 发布通道：草稿 Release 直传（v0.6.1 起）。
#   构建产物一律 gh release upload 到 tag 对应的 draft release，不再用
#   actions/upload-artifact：Actions Artifacts 有账户级配额，配额一满 upload-artifact
#   就直接失败（v0.6.1 的 linux-app 就死在这里）；release 资产不受该配额限制。
#   下游 job 用 gh release download --pattern ... 取输入，publish 最后把草稿转正。
# 必需的仓库 secrets（Settings → Secrets and variables → Actions）：
#   TAURI_SIGNING_PRIVATE_KEY           更新签名私钥（minisign/tauri signer 生成）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  私钥口令（无口令可留空）
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（形如 v0.2.0，必须是已存在的 tag）"
        required: true
        type: string
      # 见 docs/FALLBACK-POLICY.md：回退必须显式、可见、可关闭。
      weasel_mode:
        description: "Windows 内置小狼毫的来源：auto=tag 推送强制 require；手动时取仓库变量或 build"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - require
          - build
          - fetch

concurrency:
  # 手动触发时的 tag 来自 inputs.tag，用 ref_name 会让不同 tag 共用同一个 group。
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "22"
  # 所有 gh 调用都锁定本仓库：即使某步没 checkout，gh 也不会因为找不到 remote 而失败。
  GH_REPO: ${{ github.repository }}

jobs:
  # 草稿 Release 直传的唯一入口：建草稿（已存在就复用）并把 tag 传给下游。
  # 必须最早跑：下面每个 job 都要 needs 它才能拿到 tag 并写 release 资产。
  # 幂等：tag 推送失败重跑时草稿通常已经在了，直接复用；下游一律 --clobber 覆盖同名资产。
  prepare-draft:
    name: prepare-draft · 草稿 Release
    # 根 job（无 needs）：草稿必须在任何构建开始前就存在。
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_NAME}"
          case "$tag" in
            v*) : ;;
            *) echo "::error::tag 必须形如 v0.6.1，收到：$tag"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release tag: $tag"

      - name: create or reuse draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          : > /tmp/empty-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            is_draft=$(gh release view "$TAG" --json isDraft --jq .isDraft)
            echo "复用已存在的 release：$TAG（draft=$is_draft）"
            if [ "$is_draft" != "true" ]; then
              echo "::warning title=发布目标已转正::$TAG 已经是正式 release，本次会直接覆盖它的同名资产"
            fi
          else
            # --verify-tag：tag 不存在就立刻失败（多半是 workflow_dispatch 的 tag 写错）。
            gh release create "$TAG" --draft --verify-tag \
              --title "rime-sync $TAG" --notes-file /tmp/empty-notes.md
            echo "已创建草稿 release：$TAG"
          fi
          {
            echo "### 草稿 Release"
            echo ""
            echo "- tag：$TAG"
            echo "- 构建产物直传到该草稿；publish 最后一步才 --draft=false 转正。"
          } >> "$GITHUB_STEP_SUMMARY"

  # 应用本体（deb + AppImage）。ime（trixie）复用这一个 rime-sync deb：它只作为
  # 工作流内部输入，转正前会被 publish 从资产里删掉。
  linux-app:
    name: linux-app · deb + AppImage
    needs: prepare-draft
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: free runner disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: install linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            file

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 这里刻意不抓 vendor 闭包：tauri deb 的 bundle.linux.deb.files 会把
      # packaging/linux/vendor/ 整个拷进 /usr/share/rime-sync/vendor/，闭包会撑到
      # ~170 MiB。闭包只在 ime-<distro> 的 .run 里按发行版单份使用。
      # fcitx5 配置页的「立即同步」按钮调用 /usr/bin/rime-sync-cli；CLI 不在 tauri 产物里，
      # 必须在打包前编译好并放到 deb.files 指定的位置，否则该按钮会静默 no-op。
      - name: build CLI for the deb
        timeout-minutes: 15
        run: |
          set -euo pipefail
          cargo build -p rime-sync-cli --release --locked
          install -Dm755 target/release/rime-sync-cli packaging/linux/rime-sync-cli
          file packaging/linux/rime-sync-cli

      - name: build bundles (deb + AppImage)
        timeout-minutes: 45
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles deb,appimage

      - name: assert rime-sync deb
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(src-tauri/target/release/bundle/deb/*.deb)
          if [ "${#debs[@]}" -ne 1 ]; then
            echo "::error::期望恰好 1 个 rime-sync deb，实际 ${#debs[@]} 个"
            printf '  %s\n' "${debs[@]}"
            exit 1
          fi
          deb=$(basename "${debs[0]}")
          ver=$(grep -m1 '"version"' src-tauri/tauri.conf.json | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
          case "$deb" in
            "rime-sync_${ver}_"*) : ;;
            *) echo "::error::deb 名 $deb 与 tauri.conf.json 版本 $ver 不一致"; exit 1 ;;
          esac
          echo "$deb ($(( $(stat -c %s "${debs[0]}") / 1024 / 1024 )) MiB)"

      # 直接进草稿 Release：四个 ime job 用 `gh release download --pattern 'rime-sync_*.deb'` 取它。
      # 资产名只保留 basename，所以这里的 deb 名（rime-sync_<ver>_amd64.deb）就是下游看到的名字。
      - name: upload bundles to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-draft.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(src-tauri/target/release/bundle/deb/*.deb)
          appimages=(src-tauri/target/release/bundle/appimage/*.AppImage)
          sigs=(src-tauri/target/release/bundle/appimage/*.sig)
          if [ "${#debs[@]}" -eq 0 ]; then echo "::error::没有 rime-sync deb"; exit 1; fi
          if [ "${#appimages[@]}" -eq 0 ]; then echo "::error::没有 AppImage"; exit 1; fi
          if [ "${#sigs[@]}" -eq 0 ]; then echo "::error::没有 .sig（updater 签名）"; exit 1; fi
          printf '  %s\n' "${debs[@]}" "${appimages[@]}" "${sigs[@]}"
          gh release upload "$TAG" "${debs[@]}" "${appimages[@]}" "${sigs[@]}" --clobber

  # Linux 只出 trixie（Debian 13）。矩阵保留一个条目：job 名/步骤名仍按发行版参数化，
  # 以后要加发行版只需在这里加一行 + build-offline-installer.sh 的 suite_for 加一条。
  # 单套实测：镜像构建 + 编译 270-310 s，闭包 2-4 min，full+thin 组装 2-4 min。
  ime:
    name: ime · ${{ matrix.distro }}
    # linux-app 提供 rime-sync deb；prepare-draft 提供 tag（从草稿 Release 取/放资产都要它）。
    needs: [linux-app, prepare-draft]
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian-13
            suite: trixie
            image: debian:13
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: free runner disk space
        run: |
          set -euo pipefail
          # 一套 builder 镜像 1.1-1.7 GiB + staging + 闭包 + .run ≈ 5 GiB；还是先删预装 SDK。
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: preflight · docker + disk headroom
        run: |
          set -euo pipefail
          command -v docker >/dev/null 2>&1 || {
            echo "::error::runner 缺少 docker：scripts/ime/build-linux.sh 与 scripts/ime/fetch-vendor-deps.sh 都在容器里运行"
            exit 1
          }
          docker info >/dev/null 2>&1 || {
            echo "::error::docker daemon 不可用"
            exit 1
          }
          avail=$(df -Pk / | awk "NR==2 {print \$4}")
          avail_gib=$(( avail / 1024 / 1024 ))
          echo "docker: $(docker --version)"
          echo "可用磁盘: ${avail_gib} GiB"
          if [ "$avail_gib" -lt 8 ]; then
            echo "::error::可用磁盘仅 ${avail_gib} GiB（< 8 GiB）：单发行版构建装不下"
            exit 1
          fi

      # fetch-vendor-deps.sh / build-offline-installer.sh 的默认输入
      # 从草稿 Release 取 linux-app 上传的 deb（原来走 download-artifact sync-deb）。
      - name: download rime-sync deb from draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-draft.outputs.tag }}
        run: |
          set -euo pipefail
          rm -rf packaging/out
          mkdir -p packaging/out
          gh release download "$TAG" --dir packaging/out --pattern 'rime-sync_*.deb'
          ls -l packaging/out/
          shopt -s nullglob
          debs=(packaging/out/*.deb)
          if [ "${#debs[@]}" -ne 1 ]; then
            echo "::error::期望恰好 1 个 rime-sync deb，实际 ${#debs[@]} 个"
            exit 1
          fi

      - name: build input-method deb (${{ matrix.distro }})
        timeout-minutes: 20
        env:
          IMAGE: ${{ matrix.image }}
          DISTRO: ${{ matrix.distro }}
        run: |
          set -euo pipefail
          ls -l packaging/out/
          bash scripts/ime/build-linux.sh || {
            echo "::error file=scripts/ime/build-linux.sh::${DISTRO} 的输入法源码构建失败（docker build / 容器编译）"
            exit 1
          }
          f=$(ls -1t "build/deb/${DISTRO}"/rime-inputmethod_*.deb 2>/dev/null | head -n 1 || true)
          [ -n "$f" ] || { echo "::error::$DISTRO: 没有生成 rime-inputmethod deb"; exit 1; }
          echo "$DISTRO: $(basename "$f") ($(( $(stat -c %s "$f") / 1024 / 1024 )) MiB)"

      - name: fetch vendor dependency closure (${{ matrix.distro }})
        timeout-minutes: 15
        env:
          DISTRO: ${{ matrix.distro }}
        run: |
          set -euo pipefail
          bash scripts/ime/fetch-vendor-deps.sh "$DISTRO" || {
            echo "::error file=scripts/ime/fetch-vendor-deps.sh::${DISTRO} 的依赖闭包抓取失败"
            exit 1
          }
          dir=packaging/linux/vendor/$DISTRO
          n=$(find "$dir" -maxdepth 1 -name "*.deb" | wc -l)
          mib=$(du -sm "$dir" | cut -f1)
          echo "$DISTRO: $n debs, ${mib} MiB"
          if [ "$n" -lt 100 ]; then
            echo "::error::$DISTRO: vendor 闭包只有 $n 个 .deb（< 100），apt 下载很可能不完整"
            exit 1
          fi
          for f in VENDOR-INFO SHA256SUMS; do
            [ -f "$dir/$f" ] || { echo "::error::$DISTRO: 缺少 $f"; exit 1; }
          done

      - name: assemble installers · full + thin (${{ matrix.distro }})
        timeout-minutes: 20
        env:
          DISTRO: ${{ matrix.distro }}
          SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          # 一次调用出两个包：都是「IME + 同步工具」，区别只在依赖层。
          #   full -> 内置依赖闭包（断网可装）；thin -> 安装时 apt 装依赖
          bash packaging/linux/build-offline-installer.sh --both "$DISTRO" || {
            echo "::error file=packaging/linux/build-offline-installer.sh::${DISTRO} 的 .run 组装失败"
            exit 1
          }
          ver=$(grep -m1 '"version"' src-tauri/tauri.conf.json | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
          full=packaging/linux/out/rime-sync-installer_${ver}.${SUITE}.run
          thin=packaging/linux/out/rime-sync-installer_${ver}.${SUITE}.thin.run
          for f in "$full" "$thin"; do
            if [ ! -f "$f" ]; then
              echo "::error::缺少 $DISTRO 的安装器 $f"
              exit 1
            fi
            [ -x "$f" ] || { echo "::error file=$f::没有可执行位"; exit 1; }
          done
          full_size=$(stat -c %s "$full")
          thin_size=$(stat -c %s "$thin")
          full_mib=$(( full_size / 1024 / 1024 ))
          thin_mib=$(( thin_size / 1024 / 1024 ))
          echo "$full: ${full_mib} MiB"
          echo "$thin: ${thin_mib} MiB"
          if [ "$full_size" -lt $(( 100 * 1024 * 1024 )) ]; then
            echo "::error file=$full::${DISTRO} 全量包仅 ${full_mib} MiB（< 100 MiB）：IME deb 或依赖闭包没打进去"
            exit 1
          fi
          if [ "$thin_size" -lt $(( 5 * 1024 * 1024 )) ]; then
            echo "::error file=$thin::${DISTRO} 非全量包仅 ${thin_mib} MiB（< 5 MiB）：IME 或 sync deb 没打进去"
            exit 1
          fi
          if [ "$thin_size" -gt $(( 60 * 1024 * 1024 )) ]; then
            echo "::error file=$thin::${DISTRO} 非全量包 ${thin_mib} MiB（> 60 MiB）：依赖闭包被打进 thin 包了"
            exit 1
          fi
          if [ "$thin_size" -gt $(( full_size / 2 )) ]; then
            echo "::error file=$thin::${DISTRO} 非全量包不小于全量包一半：thin 应显著更小"
            exit 1
          fi
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            echo "- $DISTRO ($SUITE): $(basename "$full") ${full_mib} MiB（全量）+ $(basename "$thin") ${thin_mib} MiB（非全量）/ vendor $(find packaging/linux/vendor/$DISTRO -name "*.deb" | wc -l) debs" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: cleanup docker images
        if: always()
        run: |
          set -uo pipefail
          docker system prune -af --volumes >/dev/null 2>&1 || true
          df -h /

      # 直传草稿 Release。资产名 = basename：
      #   rime-sync-installer_<ver>.<suite>.run        全量
      #   rime-sync-installer_<ver>.<suite>.thin.run   非全量
      # 0.6.6 起 rime-inputmethod deb 不再作为独立资产：它只在两个 .run 里
      # （verify-artifacts 会从 thin.run 里解出来做入口断言）。
      # 注意：不要上传 rime-smoke（与发行版同名时 --clobber 会互相覆盖）。
      - name: upload installers to draft release (${{ matrix.distro }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-draft.outputs.tag }}
          DISTRO: ${{ matrix.distro }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          runs=(packaging/linux/out/*.run)
          if [ "${#runs[@]}" -ne 2 ]; then
            echo "::error::$DISTRO: 期望恰好 2 个 .run（全量 + thin），实际 ${#runs[@]} 个"
            exit 1
          fi
          printf '  %s\n' "${runs[@]}"
          gh release upload "$TAG" "${runs[@]}" --clobber

  # 汇总 + 验收：只有 trixie 的全量 + 非全量两个 .run 都在、且没有独立的 IME deb 资产，
  # publish 才会被触发。
  collect:
    name: collect · 汇总并断言安装器
    # ime 成功才会跑（任一发行版失败 = collect 不跑 = 不发布）。
    # windows 也要等：新的资产断言会检查两个 exe，早跑会误判缺失。
    needs: [linux-app, ime, windows, prepare-draft]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # 不再下载产物（几百 MiB 的 .run 没必要重复搬一次）：直接读草稿 Release 的资产清单。
      # GitHub 返回的 name+size 就是上传完成时的实际值，用来断言「两个安装器都在且体积符合预期」。
      - name: list draft release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-draft.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json isDraft,assets \
            --jq '"draft=\(.isDraft), assets=\(.assets | length)"'
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)\t\(.size)"' | sort

      # 资产清单的断言逻辑独立成脚本：可以用假清单离线自检（CI 的
      # "guard · release asset inventory" 就是跑它的自检）。
      - name: assert 2 installers (full + thin), no standalone IME deb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-draft.outputs.tag }}
        run: |
          set -euo pipefail
          ver=$(grep -m1 '"version"' src-tauri/tauri.conf.json | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.size)"' > /tmp/assets.txt
          bash .github/scripts/assert-release-assets.sh \
            --assets /tmp/assets.txt \
            --version "$ver" \
            --suite trixie

  windows:
    name: windows · nsis + portable zip
    needs: prepare-draft
    # 固定 2022：脚本的前提是 VS2022 + v143 + boost 1.84（windows-latest 会跟着微软迁移，
    # 迁移当天工具集/boost 探测会一起漂移）。要换 runner 请先跑一遍 build-weasel.ps1 -Check。
    runs-on: windows-2022
    # 0.6.5 起同一次 job 要打两遍 NSIS（在线包 + 内嵌 WebView2 的离线包），
    # 离线包压缩一个 ~130 MiB 载荷很慢；0.6.9 起还要先自建 librime（两个架构 × deps+librime），
    # 冷缓存首跑大约多加 25-35 分钟。超时给足。
    timeout-minutes: 150
    permissions:
      contents: write
    outputs:
      weasel_mode: ${{ steps.weasel_mode.outputs.mode }}
      weasel_source: ${{ steps.weasel_verify.outputs.source }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # 模式解析（唯一真源）：
      #   tag 推送              → require：自编译失败直接让 job 失败，绝不用上游包顶替
      #   手动 workflow_dispatch → inputs.weasel_mode（auto 时取仓库变量 vars.RIMESYNC_WEASEL_MODE，缺省 build）
      # build 允许回退，但产物里带 WEASEL-SOURCE.json 标记，publish 用它写红字发布说明。
      - name: resolve weasel mode
        id: weasel_mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.weasel_mode }}
          REPO_VAR: ${{ vars.RIMESYNC_WEASEL_MODE }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            mode=require
            source_note="tag 推送强制 require"
          else
            case "$INPUT_MODE" in
              "" | auto) mode="${REPO_VAR:-build}" ;;
              *) mode="$INPUT_MODE" ;;
            esac
            source_note="手动触发 inputs.weasel_mode=$INPUT_MODE"
          fi
          case "$mode" in
            require | build | fetch) : ;;
            *)
              echo "::error::未知的 Weasel 模式：$mode（只接受 require|build|fetch）"
              exit 1
              ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "RIMESYNC_WEASEL_MODE=$mode" >> "$GITHUB_ENV"
          echo "weasel mode: $mode（$source_note）"
          {
            echo "### Weasel 模式：$mode"
            echo ""
            case "$mode" in
              require) echo "- 自编译失败 = 本 job 失败，不允许回退上游官方安装包。" ;;
              build) echo "- 自编译失败会回退上游官方安装包：**本版将不带「Rime 同步」入口**，发布说明与 summary 会红字标注。" ;;
              fetch) echo "- 直接使用上游官方安装包：**本版不带「Rime 同步」入口**（显式选择，仍会红字标注）。" ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 缓存四件套：
      #   boost/ + stage/   命中就直接跳过下载/bootstrap/b2（日志会打印「来源=cache」）
      #   b2.exe            源码/头文件在、但 b2 丢了时不用重跑 bootstrap
      #   boost_1_84_0.7z   失败重跑时不必再从 archives.boost.io 拉 120 MB
      # key 含 build-weasel.ps1 的哈希：脚本一改就换 key，但 restore-keys 会捞上一次的同名缓存，
      # 所以调试期间不会每次都从零编译。
      - name: cache weasel build deps (boost 1.84.0)
        if: steps.weasel_mode.outputs.mode != 'fetch'
        uses: actions/cache@v4
        with:
          path: |
            third_party/weasel/deps/boost_1_84_0/boost
            third_party/weasel/deps/boost_1_84_0/stage
            third_party/weasel/deps/boost_1_84_0/b2.exe
            third_party/weasel/deps/boost_1_84_0/project-config.jam
            third_party/weasel/deps/boost_1_84_0.7z
          key: ${{ runner.os }}-weasel-boost-1.84.0-${{ hashFiles('scripts/ime/build-weasel.ps1', 'third_party/weasel/weasel.sln') }}
          restore-keys: |
            ${{ runner.os }}-weasel-boost-1.84.0-

      # 自建 librime（0.6.9）的缓存：
      #   third_party/librime/deps/<name>/build  MSVC 增量编译目录（deps 静态库）
      #   third_party/librime/build              librime 自己的 build\x64 与 build\win32
      # 命中后 build-librime-win.ps1 只做 configure + install，不再重编 deps/源码；
      # 不缓存 dist\（安装前缀）：它由 --target install 立刻重建，缓存它反而可能留下别的
      # 架构/工具集的 DLL。key 含 deps pin 与脚本哈希，pin 或脚本一改就换 key。
      - name: cache self-built librime (deps + build dirs)
        if: steps.weasel_mode.outputs.mode != 'fetch'
        uses: actions/cache@v4
        with:
          path: |
            third_party/librime/deps/glog/build
            third_party/librime/deps/leveldb/build
            third_party/librime/deps/yaml-cpp/build
            third_party/librime/deps/marisa-trie/build
            third_party/librime/deps/opencc/build
            third_party/librime/build
          key: >-
            ${{ runner.os }}-librime-1.17.0-glog-v0.6.0-leveldb-1.23-yamlcpp-0.8.0-marisa-v0.2.6-opencc-ver.1.1.7-${{ hashFiles('scripts/ime/build-librime-win.ps1') }}
          restore-keys: |
            ${{ runner.os }}-librime-1.17.0-

      # 先在 1 分钟内把工具链看清楚，再进 90 分钟的自编译。
      # -Check 不下载、不编译，只打印 repo root/VS/cl.exe/b2/boost 状态；
      # v0.6.1 的失败点（bootstrap 探测不到工具集）在这里就会以「cl.exe = ok」+ VS 路径暴露。
      - name: preflight · weasel toolchain（VS2022 / v143 / boost 缓存）
        if: steps.weasel_mode.outputs.mode != 'fetch'
        timeout-minutes: 10
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/ime/build-weasel.ps1 -Check
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::build-weasel.ps1 -Check 失败（exit $LASTEXITCODE）：VS 工具链或 vendored 源码不完整"
            exit $LASTEXITCODE
          }

      # 0.6.9：先自建 librime，再编 Weasel。
      # 为什么必须自建：上游预编译包（1.13.1）里没有外部插件加载逻辑（librime 的
      # plugins/PluginManager 在 _WIN32 下是 TODO），所以 rimesync-extra 只有在
      # BUILD_MERGED_PLUGINS=ON 时直接编进 rime.dll 才对 Weasel 生效。脚本会把 deps 按 pin
      # 浅克隆、编 x64 + Win32 两份、按 get-rime.ps1 的布局摆进 third_party/weasel，
      # 并断言两个 rime.dll 里都有 rimesync_vnum / rimesync_punct / rimesync_vselect。
      # require（tag 发布）：失败即本 job 失败；build/fetch（手动）：这里红了，后面 Weasel
      # 那步也必然失败（布局不全），按既有规则回退上游官方安装包（红字标注，且
      # verify-artifacts 会发现 rime.dll 里没有插件）。
      - name: build librime from vendored source (merged rimesync-extra)
        id: librime_selfbuild
        if: steps.weasel_mode.outputs.mode != 'fetch'
        continue-on-error: ${{ steps.weasel_mode.outputs.mode != 'require' }}
        timeout-minutes: 50
        shell: pwsh
        env:
          WEASEL_MODE: ${{ steps.weasel_mode.outputs.mode }}
        run: |
          pwsh -NoProfile -File scripts/ime/build-librime-win.ps1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::build-librime-win.ps1 失败（exit $LASTEXITCODE；模式 $env:WEASEL_MODE）：自建 librime 失败，Windows 版将没有输入增强插件"
            exit $LASTEXITCODE
          }
          Get-Item -LiteralPath 'third_party/weasel/output/rime.dll' |
            ForEach-Object { Write-Host ("self-built rime.dll: {0:N1} MiB" -f ($_.Length / 1MB)) }

      # 从 vendored 源码（third_party/weasel = rime/weasel 0.17.4）编译 Weasel 安装包。
      # 依赖：VS2022/v143 + boost 1.84.0（脚本自建/缓存）+ 自建 librime（上一步）
      #       + NSIS 3.08（脚本自动安装）。脚本内部会做产物断言。
      #
      # boost 的取法（v0.6.1 就死在这一步）：
      #   脚本现在固定 `call bootstrap.bat vc143`，并把 VSINSTALLDIR/VCINSTALLDIR/VS170COMNTOOLS
      #   显式喂进 dev shell。原因：boost 1.84 的 bootstrap 不带 toolset 时会走 guess_toolset.bat，
      #   那里只认 VS2017 路径，VS2022-only 的 runner 上必然报
      #   "### unable to detect your toolset installation" 然后 exit 1。
      #   不要改用 SourceForge 的预编译包：它是 /MD，Weasel 是 /MT，链接会硬失败（LNK1104/LNK2038）。
      # require（tag 发布）：失败即本 job 失败，**不回退**（v0.6.0 事故的根因就是这里静默回退了）。
      # build/fetch（手动）：失败只让本步骤红，下一步回退上游官方包，但会在 summary / 发布说明红字标注。
      - name: build weasel installer from vendored source
        id: weasel_selfbuild
        if: steps.weasel_mode.outputs.mode != 'fetch'
        continue-on-error: ${{ steps.weasel_mode.outputs.mode != 'require' }}
        timeout-minutes: 90
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEASEL_MODE: ${{ steps.weasel_mode.outputs.mode }}
        run: |
          pwsh -NoProfile -File scripts/ime/build-weasel.ps1 -LibrimeSource self
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::build-weasel.ps1 失败（exit $LASTEXITCODE；模式 $env:WEASEL_MODE）：require=本 job 失败，build/fetch=回退上游安装包"
            exit $LASTEXITCODE
          }
          $exe = Get-Item -LiteralPath 'packaging/windows/vendor/weasel-0.17.4.0-installer.exe'
          Write-Host ("self-built weasel: {0:N1} MiB" -f ($exe.Length / 1MB))

      # 只有自编译失败时才跑：把 VS 安装 / cl.exe / boost 目录状态一次性打到日志里。
      # v0.6.1 的日志里只有 "unable to detect your toolset installation" 这一句猜谜；
      # 下一次失败应该能从日志直接读出「哪份 VS、有没有 cl、b2 在不在、boost 源码树齐不齐」。
      - name: dump toolchain diagnostics (self-build failed)
        if: steps.weasel_selfbuild.outcome == 'failure' || steps.librime_selfbuild.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Host '==== vswhere installations ===='
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (Test-Path -LiteralPath $vswhere) {
            & $vswhere -all -products '*' -property installationPath
            & $vswhere -all -products '*' -property installationVersion
          } else {
            Write-Host "vswhere 不存在：$vswhere"
          }
          Write-Host '==== boost tree ===='
          $root = 'third_party/weasel/deps/boost_1_84_0'
          Get-ChildItem -LiteralPath $root -ErrorAction SilentlyContinue |
            Select-Object Mode, Length, Name | Format-Table -AutoSize | Out-String | Write-Host
          Write-Host ('b2.exe = ' + (Test-Path -LiteralPath (Join-Path $root 'b2.exe')))
          Write-Host ('bootstrap.bat = ' + (Test-Path -LiteralPath (Join-Path $root 'bootstrap.bat')))
          $lib = Join-Path $root 'stage/lib'
          if (Test-Path -LiteralPath $lib) {
            Get-ChildItem -LiteralPath $lib -Filter 'libboost_filesystem-*.lib' | Select-Object -ExpandProperty Name
          }
          Write-Host '==== self-built librime ===='
          $lr = 'third_party/librime'
          foreach ($rel in @('build', 'build/deps-x64', 'build/deps-win32', 'dist/x64', 'dist/Win32')) {
            $path = Join-Path $lr $rel
            Write-Host ("{0} = {1}" -f $rel, (Test-Path -LiteralPath $path))
          }
          foreach ($rel in @('deps/glog/CMakeLists.txt', 'deps/leveldb/CMakeLists.txt', 'deps/yaml-cpp/CMakeLists.txt', 'deps/marisa-trie/CMakeLists.txt', 'deps/opencc/CMakeLists.txt')) {
            $path = Join-Path $lr $rel
            Write-Host ("{0} = {1}" -f $rel, (Test-Path -LiteralPath $path))
          }
          foreach ($rel in @('dist/x64/lib/rime.dll', 'dist/Win32/lib/rime.dll', 'output/rime.dll', 'output/Win32/rime.dll', 'lib64/rime.lib', 'lib/rime.lib')) {
            $path = if ($rel -like 'dist/*') { Join-Path $lr $rel } else { Join-Path 'third_party/weasel' $rel }
            Write-Host ("{0} = {1}" -f $rel, (Test-Path -LiteralPath $path))
          }
          if (Test-Path -LiteralPath (Join-Path $lr 'dist/LIBRIME-BUILD.json')) {
            Get-Content -LiteralPath (Join-Path $lr 'dist/LIBRIME-BUILD.json') -Raw
          }
          Write-Host '==== librime preflight (-Check) ===='
          pwsh -NoProfile -File scripts/ime/build-librime-win.ps1 -Check
          Write-Host '==== preflight (-Check) ===='
          pwsh -NoProfile -File scripts/ime/build-weasel.ps1 -Check
          exit 0

      # 离线兜底：fetch-weasel.ps1 仍然保留，下载并校验上游官方安装包（大小 + SHA-256）。
      # 触发条件：显式 mode=fetch（或手动选了 build 且自编译失败）。
      # require 模式下这一步永远不跑：上一步失败已经让 job 红了。
      - name: fetch upstream weasel installer (fallback / offline mode)
        if: steps.weasel_mode.outputs.mode != 'require' && (steps.weasel_mode.outputs.mode == 'fetch' || steps.weasel_selfbuild.outcome == 'failure')
        timeout-minutes: 15
        shell: pwsh
        run: |
          if ('${{ steps.weasel_selfbuild.outcome }}' -eq 'failure') {
            Write-Host '::error title=Weasel 回退::自编译 Weasel 失败，回退上游官方安装包：本版 Windows 版将没有「输入法自建同步」入口（已写进 summary 与发布说明）'
          } else {
            Write-Host '::error title=Weasel 回退::RIMESYNC_WEASEL_MODE=fetch：直接使用上游官方安装包，本版没有「输入法自建同步」入口'
          }
          if ($env:GITHUB_STEP_SUMMARY) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value @(
              '> [!CAUTION]',
              '> **本版未包含 Weasel 入口**（上游官方 Weasel 回退）。',
              '> 规则见 docs/FALLBACK-POLICY.md。'
            )
          }
          if (-not (Test-Path -LiteralPath 'packaging/windows/fetch-weasel.ps1')) {
            Write-Host '::error::缺少 packaging/windows/fetch-weasel.ps1（兜底路径不可用）'
            exit 1
          }
          pwsh -NoProfile -File packaging/windows/fetch-weasel.ps1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::fetch-weasel.ps1 失败（exit $LASTEXITCODE）"
            exit $LASTEXITCODE
          }

      # 验收：内嵌的 Weasel 必须真的来自我们自己编译的源码。
      # require 模式下自编译失败 = 本 job 失败（绝不静默回退）。
      # 回退时写 packaging/out/WEASEL-SOURCE.json：publish 用它写红字发布说明，
      # verify-artifacts 用它决定是否放行「WeaselServer.exe 里没有 Rime 同步」。
      - name: verify weasel vendor payload
        id: weasel_verify
        shell: pwsh
        env:
          WEASEL_MODE: ${{ steps.weasel_mode.outputs.mode }}
        run: |
          $exe = Get-ChildItem -LiteralPath 'packaging/windows/vendor' -Filter 'weasel-*.exe' -File -ErrorAction SilentlyContinue |
            Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe) {
            Write-Host '::error::packaging/windows/vendor 下没有 weasel-*.exe，NSIS 安装包里不会有输入法'
            exit 1
          }
          $mib = [math]::Round($exe.Length / 1MB, 1)
          Write-Host "vendor: $($exe.Name) $mib MiB"
          if ($exe.Length -lt 8MB) {
            Write-Host "::error::weasel 安装包只有 $mib MiB（< 8 MiB），疑似下载/构建不完整"
            exit 1
          }

          $mode = $env:WEASEL_MODE
          $selfbuilt = '${{ steps.weasel_selfbuild.outcome }}'
          $source = 'upstream'
          if ($selfbuilt -eq 'success') { $source = 'self-built' }

          if ($mode -eq 'require' -and $source -ne 'self-built') {
            Write-Host "::error title=Weasel 自编译失败::RIMESYNC_WEASEL_MODE=require：自编译 Weasel 失败（outcome=$selfbuilt），本版不允许回退上游官方安装包；请修 scripts/ime/build-weasel.ps1"
            exit 1
          }

          # librime 来源（0.6.9）：自编译 Weasel 内嵌的是自建 librime（合并 rimesync-extra），
          # 上游回退包内嵌的是官方预编译 1.13.1（没有插件加载能力）。
          $librimeVersion = '1.17.0'
          $cml = 'third_party/librime/CMakeLists.txt'
          if (Test-Path -LiteralPath $cml) {
            $raw = Get-Content -LiteralPath $cml -Raw -Encoding UTF8
            $m = [regex]::Match($raw, 'set\(rime_version\s+([0-9][0-9A-Za-z.\-]*)\s*\)')
            if ($m.Success) { $librimeVersion = $m.Groups[1].Value }
          }
          $librime = 'prebuilt 1.13.1 (no plugins)'
          if ($source -eq 'self-built') {
            $librime = 'self-built ' + $librimeVersion + ' (merged rimesync-extra)'
          }

          $marker = 'packaging/out/WEASEL-SOURCE.json'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $marker) | Out-Null
          $payload = [ordered]@{
            mode              = $mode
            source            = $source
            selfbuild_outcome = $selfbuilt
            librime           = $librime
            installer         = $exe.Name
            installer_bytes   = $exe.Length
            caption           = 'Rime 同步'
            written_at        = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          }
          $payload | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $marker -Encoding utf8
          Write-Host "weasel source: $source（mode=$mode）；librime: $librime"
          Write-Host "marker: $marker"
          "source=$source" >> $env:GITHUB_OUTPUT

          if ($env:GITHUB_STEP_SUMMARY) {
            if ($source -eq 'self-built') {
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value (
                "- Weasel 安装器：{0}（{1} MiB，来源：自编译 third_party/weasel @ 0.17.4，模式 {2}）" -f $exe.Name, $mib, $mode)
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ("- librime：{0}（rime.dll 含 rimesync_vnum / rimesync_punct / rimesync_vselect）" -f $librime)
            } else {
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value @(
                '> [!CAUTION]',
                ('> **本版未包含 Weasel 入口**：Windows 安装包用的是上游官方 Weasel（自编译 outcome=' + $selfbuilt + '，模式 ' + $mode + '）。'),
                '> 「Rime 同步…」菜单项不存在；规则见 docs/FALLBACK-POLICY.md。'
              )
            }
          }

      # 双保险（与 build-librime-win.ps1 / build-weasel.ps1 内部断言同一判据，但对象更靠后一环）：
      # 把**真正要嵌进 NSIS setup.exe 的那个** weasel 安装包解开，确认每个 rime.dll 里都有
      # rimesync_vnum / rimesync_punct / rimesync_vselect。组件名是 registry 注册用的普通
      # 字符串常量，合进 rime.dll 后是 UTF-8（= ASCII）明文；预编译包一个都搜不到。
      # 只在自编译 Weasel 成功时跑：上游回退包本来就不带插件（那种情况由 verify-artifacts 红字标注）。
      - name: assert rime.dll carries rimesync components
        if: steps.weasel_selfbuild.outcome == 'success'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath 'packaging/windows/vendor' -Filter 'weasel-*.exe' -File -ErrorAction SilentlyContinue |
            Sort-Object Length -Descending | Select-Object -First 1
          if (-not $installer) {
            Write-Host '::error::packaging/windows/vendor 下没有 weasel-*.exe，无从断言 rime.dll'
            exit 1
          }
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          if (-not (Test-Path -LiteralPath $sevenZip)) {
            $cmd = Get-Command '7z.exe' -ErrorAction SilentlyContinue
            if ($cmd) { $sevenZip = $cmd.Source }
          }
          if (-not $sevenZip) {
            Write-Host '::error::找不到 7z.exe（windows-2022 runner 自带 C:\Program Files\7-Zip）'
            exit 1
          }
          $tmp = Join-Path $env:RUNNER_TEMP 'rime-dll-assert'
          if (Test-Path -LiteralPath $tmp) { Remove-Item -LiteralPath $tmp -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          & $sevenZip x -y "-o$tmp" $installer.FullName | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::7z 解不开 $($installer.Name)"
            exit 1
          }

          $dlls = @(Get-ChildItem -LiteralPath $tmp -Recurse -File -Filter 'rime.dll')
          if ($dlls.Count -eq 0) {
            Write-Host "::error::weasel 安装包里没有 rime.dll（$($installer.Name)）"
            exit 1
          }
          $names = @('rimesync_vnum', 'rimesync_punct', 'rimesync_vselect')
          $missing = @()
          foreach ($dll in $dlls) {
            $text = [System.Text.Encoding]::GetEncoding(28591).GetString([System.IO.File]::ReadAllBytes($dll.FullName))
            foreach ($name in $names) {
              if ($text.IndexOf($name, [System.StringComparison]::Ordinal) -lt 0) {
                $missing += ("{0}:{1}" -f $dll.FullName.Substring($tmp.Length).TrimStart('\'), $name)
              }
            }
            Write-Host ("{0}  {1:N1} MiB" -f $dll.FullName.Substring($tmp.Length), ($dll.Length / 1MB))
          }
          if ($missing.Count -gt 0) {
            Write-Host ("::error title=librime 没带插件::weasel 安装包里的 rime.dll 缺组件：" + ($missing -join ', ') +
              '（v 模式 / 标点 Shift 备选 / a-h 选词 不会生效）')
            exit 1
          }
          Write-Host ("rime.dll 组件齐全：{0}（{1} 个架构）" -f ($names -join ' / '), $dlls.Count)

      - name: build nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles nsis

      # 验收断言：最终 setup.exe ≥ 12 MiB（内嵌的 Weasel 安装器约 10 MiB，未被 LZMA 压没）。
      - name: assert nsis setup embeds weasel
        shell: pwsh
        run: |
          $setup = Get-ChildItem -LiteralPath 'src-tauri/target/release/bundle/nsis' -Filter '*-setup.exe' -File -ErrorAction SilentlyContinue |
            Sort-Object Length -Descending | Select-Object -First 1
          if (-not $setup) {
            Write-Host '::error::没找到 NSIS 安装包（src-tauri/target/release/bundle/nsis/*-setup.exe）'
            exit 1
          }
          $mib = [math]::Round($setup.Length / 1MB, 1)
          Write-Host "NSIS setup: $($setup.Name) $mib MiB"
          if ($setup.Length -lt 12MB) {
            Write-Host "::error::NSIS 安装包只有 $mib MiB（< 12 MiB）：内置 Weasel 很可能没打进去。"
            Write-Host "检查 packaging/windows/vendor/weasel-*.exe 是否存在，以及 makensis 日志里"
            Write-Host "是否有 'NSIS_HOOK_PREINSTALL' 相关告警（packaging/nsis-hooks.nsh 的 !warning）。"
            exit 1
          }

      # ---- 离线包（0.6.5）：内嵌 WebView2 Standalone，受限代理/内网也能装 ----
      # 1) 先把刚打好的在线包挪走：离线包会写回同一个文件名，不挪就被覆盖。
      - name: stash online nsis artifacts
        shell: pwsh
        run: |
          $src = 'src-tauri/target/release/bundle/nsis'
          $dst = 'packaging/out/nsis-online'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          $files = @(Get-ChildItem -LiteralPath $src -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like '*-setup.exe' -or $_.Name -like '*-setup.exe.sig' })
          if ($files.Count -eq 0) {
            Write-Host '::error::没有可留存的在线 NSIS 产物（*-setup.exe / *.sig）'
            exit 1
          }
          $files | Copy-Item -Destination $dst -Force
          Remove-Item -LiteralPath $src -Recurse -Force
          New-Item -ItemType Directory -Force -Path $src | Out-Null
          Get-ChildItem -LiteralPath $dst | ForEach-Object {
            Write-Host "  online: $($_.Name) $([math]::Round($_.Length / 1MB, 1)) MiB"
          }

      # 2) WebView2 Evergreen Standalone（x64，约 130 MiB）。脚本自带 3 次重试、
      #    体积下限 100 MiB 与 MZ 头校验：抓回在线引导器/错误页会当场失败。
      - name: fetch WebView2 standalone payload (offline variant)
        timeout-minutes: 30
        run: pwsh -NoProfile -File packaging/windows/fetch-webview2.ps1

      # 3) 第二遍 NSIS：只覆盖 installerHooks（→ nsis-hooks-offline.nsh 定义
      #    RIMESYNC_EMBED_WEBVIEW），其余配置沿用 tauri.conf.json。
      - name: build nsis (offline variant, embeds WebView2)
        timeout-minutes: 60
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles nsis --config src-tauri/tauri.offline.conf.json

      # 4) 改名成 *-offline-setup.exe（+ .sig）并断言体积：< 100 MiB 说明 WebView2 没打进去。
      #    updater 的 latest.json 只认在线包，offline 变体不得进入（见 make-latest-json.py）。
      - name: rename and assert offline bundle
        shell: pwsh
        run: |
          $nsis = 'src-tauri/target/release/bundle/nsis'
          $exes = @(Get-ChildItem -LiteralPath $nsis -File -Filter '*-setup.exe' -ErrorAction SilentlyContinue)
          if ($exes.Count -ne 1) {
            Write-Host "::error::离线构建后应只有 1 个 *-setup.exe，实际 $($exes.Count) 个"
            exit 1
          }
          $exe = $exes[0]
          $newName = $exe.Name -replace '-setup\.exe$', '-offline-setup.exe'
          Rename-Item -LiteralPath $exe.FullName -NewName $newName
          $sigOld = "$($exe.FullName).sig"
          if (-not (Test-Path -LiteralPath $sigOld)) {
            Write-Host "::error::离线包没有 .sig（updater 签名缺失）：$sigOld"
            exit 1
          }
          Rename-Item -LiteralPath $sigOld -NewName "$newName.sig"
          $offline = Get-Item -LiteralPath (Join-Path $nsis $newName)
          $mib = [math]::Round($offline.Length / 1MB, 1)
          Write-Host "offline setup: $($offline.Name) $mib MiB"
          if ($offline.Length -lt 100MB) {
            Write-Host "::error::离线包只有 $mib MiB（< 100 MiB）：WebView2 Standalone 没打进去。"
            Write-Host '检查 packaging/windows/vendor/MicrosoftEdgeWebView2RuntimeInstallerX64.exe 是否存在，'
            Write-Host "以及 makensis 日志里的 'offline build ... without WebView2 payload' 告警。"
            exit 1
          }
          if ($env:GITHUB_STEP_SUMMARY) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value (
              "- Windows 离线包：{0}（{1} MiB，内嵌 WebView2 Standalone，不联网）" -f $offline.Name, $mib)
          }

      - name: build portable zip
        shell: pwsh
        run: ./packaging/portable-zip.ps1 -TargetDir src-tauri/target/release -OutDir packaging/out

      # 直传草稿 Release（用 bash 而不是 pwsh：让 shell 真正展开通配符，缺文件能当场断言）。
      # Weasel 来源标记 WEASEL-SOURCE.json 也一起上传：publish 据此写红字发布说明。
      - name: upload windows artifacts to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-draft.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # 在线包（stash 出来的）与离线包（*-offline-setup.exe）都要上传，各自带 .sig
          online=(packaging/out/nsis-online/*-setup.exe)
          online_sigs=(packaging/out/nsis-online/*-setup.exe.sig)
          offline=(src-tauri/target/release/bundle/nsis/*-offline-setup.exe)
          offline_sigs=(src-tauri/target/release/bundle/nsis/*-offline-setup.exe.sig)
          zips=(packaging/out/*.zip)
          marker=packaging/out/WEASEL-SOURCE.json
          if [ "${#online[@]}" -ne 1 ]; then echo "::error::在线 NSIS 安装包应有 1 个，实际 ${#online[@]} 个"; exit 1; fi
          if [ "${#online_sigs[@]}" -ne 1 ]; then echo "::error::在线包的 .sig（updater 签名）应有 1 个，实际 ${#online_sigs[@]} 个"; exit 1; fi
          if [ "${#offline[@]}" -ne 1 ]; then echo "::error::离线 NSIS 安装包应有 1 个，实际 ${#offline[@]} 个"; exit 1; fi
          if [ "${#offline_sigs[@]}" -ne 1 ]; then echo "::error::离线包的 .sig 应有 1 个，实际 ${#offline_sigs[@]} 个"; exit 1; fi
          if [ "${#zips[@]}" -eq 0 ]; then echo "::error::没有便携版 zip"; exit 1; fi
          if [ ! -f "$marker" ]; then echo "::error::缺少 $marker"; exit 1; fi
          for f in "${online[@]}"; do
            name=$(basename "$f")
            case "$name" in *-offline-setup.exe) echo "::error::在线产物里混进了离线包：$name"; exit 1 ;; esac
          done
          offline_bytes=$(stat -c %s "${offline[0]}")
          offline_mib=$(( offline_bytes / 1024 / 1024 ))
          echo "  offline setup: ${offline_mib} MiB"
          if [ "$offline_bytes" -lt $(( 100 * 1024 * 1024 )) ]; then
            echo "::error::离线包仅 ${offline_mib} MiB（< 100 MiB）：WebView2 Standalone 没打进去"
            exit 1
          fi
          printf '  %s\n' "${online[@]}" "${online_sigs[@]}" "${offline[@]}" "${offline_sigs[@]}" "${zips[@]}" "$marker"
          gh release upload "$TAG" \
            "${online[@]}" "${online_sigs[@]}" \
            "${offline[@]}" "${offline_sigs[@]}" \
            "${zips[@]}" "$marker" --clobber

  # 产物验收：把"用户能看见的功能入口"变成断言（v0.6.0 事故的直接防线）。
  # 失败就不发布：publish 依赖本 job。
  verify-artifacts:
    name: verify-artifacts · 功能入口断言
    needs: [collect, windows, prepare-draft]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # 草稿 Release 是唯一产物来源（不再有 workflow artifact）。
      # 只下断言要用的：thin .run（几 MiB，里面装着 IME deb）+ rime-sync deb + setup.exe。
      # 资产名是扁平的，全部落在 dist/ 根下；脚本用 find 递归找，不依赖目录布局。
      - name: download built artifacts from draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-draft.outputs.tag }}
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          gh release download "$TAG" --dir dist --pattern '*.deb' --pattern '*-setup.exe' \
            --pattern '*.thin.run'
          find dist -maxdepth 2 -type f -printf '%P  %s bytes\n' | sort

      # 0.6.6 起 rime-inputmethod deb 不再作为独立资产发布，但"入口必须在 IME 包内"这条
      # 断言不能丢：从 thin .run 的自解压载荷里把它取出来再交给 verify-artifacts.sh。
      - name: extract IME deb from thin installer
        run: |
          set -euo pipefail
          shopt -s nullglob
          runs=(dist/*.thin.run)
          if [ "${#runs[@]}" -ne 1 ]; then
            echo "::error::期望恰好 1 个 thin .run，实际 ${#runs[@]} 个"
            exit 1
          fi
          tmp=$(mktemp -d)
          marker=__RIME_SYNC_PAYLOAD_BELOW__
          line=$(awk -v m="$marker" '$0 == m { print NR + 1; exit }' "${runs[0]}")
          [ -n "$line" ] || { echo "::error::${runs[0]} 里没有载荷标记"; exit 1; }
          tail -n +"$line" "${runs[0]}" | tar -xzf - -C "$tmp"
          mapfile -t ime < <(find "$tmp" -type f -name 'rime-inputmethod_*.deb' | sort)
          if [ "${#ime[@]}" -ne 1 ]; then
            echo "::error::thin .run 里应有恰好 1 个 rime-inputmethod deb，实际 ${#ime[@]} 个"
            find "$tmp" -type f | sed -n '1,20p'
            exit 1
          fi
          cp -f "${ime[0]}" dist/
          echo "从 $(basename "${runs[0]}") 取出 $(basename "${ime[0]}")（$(( $(stat -c %s "${ime[0]}") / 1024 / 1024 )) MiB）"
          rm -rf "$tmp"
          find dist -maxdepth 1 -type f -printf '%P  %s bytes\n' | sort

      - name: install extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      # Weasel 严格程度由 windows job 解析出的模式决定：
      # require → WeaselServer.exe 里必须有「Rime 同步」，否则失败；
      # build/fetch → 允许上游回退，但 summary/发布说明红字标注。
      - name: verify artifacts
        env:
          WEASEL_MODE: ${{ needs.windows.outputs.weasel_mode }}
        run: |
          set -euo pipefail
          echo "Weasel 模式：${WEASEL_MODE:-require}"
          find dist -maxdepth 5 -type f -printf '%P  %s bytes\n' | sort | sed -n '1,60p'
          # 0.6.5 起多一个离线包（内嵌 WebView2）：存在性 + 体积 + 两个载荷都要断言
          bash .github/scripts/verify-artifacts.sh --dir dist --require-offline-setup \
            --weasel-mode "${WEASEL_MODE:-require}"

  publish:
    name: publish · 汇总产物并生成 latest.json
    # verify-artifacts 通过才允许发布；collect/windows 再兜一层（任一发行版缺失都不发布）。
    needs: [verify-artifacts, collect, windows, prepare-draft]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # 只下 publish 真正需要的：updater 的 .sig + 对应产物（make-latest-json.py 要成对读）
      # 和 Weasel 来源标记。大件（.run / 各 deb / AppImage / setup.exe）已经在草稿 Release 里，
      # 不必再下载一遍——这正是「草稿直传」省下来的带宽。
      - name: download updater inputs from draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-draft.outputs.tag }}
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          gh release download "$TAG" --dir dist \
            --pattern '*.AppImage' \
            --pattern '*.AppImage.sig' \
            --pattern '*-setup.exe' \
            --pattern '*-setup.exe.sig' \
            --pattern 'WEASEL-SOURCE.json'
          # 离线包（*-offline-setup.exe）是给受限代理/内网用的独立变体，
          # **不能**进 latest.json：updater 只认在线包，否则会把离线包当更新下发给所有人。
          rm -f dist/*-offline-setup.exe dist/*-offline-setup.exe.sig
          find dist -type f -printf '%P  %s bytes\n' | sort

      - name: generate release notes
        env:
          TAG: ${{ needs.prepare-draft.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          # 更新提示直接用 CHANGELOG 的中文段落（用户要求：提示里显示本版更新内容）。
          python3 .github/scripts/changelog-notes.py --version "$VERSION" --out dist/notes.md

      # docs/FALLBACK-POLICY.md：任何回退必须在发布说明里可见。
      # WEASEL-SOURCE.json 由 windows job 写出并随 windows-bundles 上传。
      - name: disclose weasel fallback
        run: |
          set -euo pipefail
          # gh release download 只保留 basename，标记会落在 dist 根下；仍然用 find 兜住布局变化。
          marker=$(find dist -name 'WEASEL-SOURCE.json' -type f | sort | sed -n '1p')
          if [ -z "$marker" ] || [ ! -f "$marker" ]; then
            echo "::error title=Weasel 来源未知::dist 里没有 WEASEL-SOURCE.json，无法确认本版是否带「Rime 同步」入口"
            exit 1
          fi
          echo "weasel marker: $marker"
          python3 - "$marker" > dist/weasel-warning.md <<'PY'
          import json
          import sys

          # Windows 侧 Set-Content 可能带 BOM，utf-8-sig 两种情况都能读。
          data = json.load(open(sys.argv[1], encoding="utf-8-sig"))
          if data.get("source") == "self-built":
              sys.exit(0)
          print("> [!CAUTION]")
          print("> **本版未包含 Weasel 入口**（Windows 安装包里没有「Rime 同步…」菜单项）。")
          print(">")
          print(f"> Weasel 安装器来源：{data.get('installer', '?')}"
                f"（self-build outcome={data.get('selfbuild_outcome', '?')}，"
                f"模式 {data.get('mode', '?')}）。")
          print(">")
          print("> 规则见 docs/FALLBACK-POLICY.md；修复后重跑构建即恢复入口。")
          PY
          if [ -s dist/weasel-warning.md ]; then
            cat dist/weasel-warning.md dist/notes.md > dist/notes.new
            mv dist/notes.new dist/notes.md
            {
              echo "## Weasel 回退（发布说明已红字标注）"
              echo ""
              cat dist/weasel-warning.md
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Weasel 回退::本版未包含 Weasel 入口，已在发布说明顶部标注"
          else
            echo "Weasel 来源：自编译（发布说明无需告警）"
            echo "- Weasel：自编译，入口完整" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: generate latest.json
        env:
          TAG: ${{ needs.prepare-draft.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          python3 .github/scripts/make-latest-json.py \
            --dir dist \
            --version "$VERSION" \
            --repo "${{ github.repository }}" \
            --tag "$TAG" \
            --notes-file dist/notes.md \
            --out dist/latest.json

      # 0.6.6：Linux 只发「一个包 = 输入法本体 + 同步工具」，rime-sync deb 只是工作流
      # 内部传递（ime 抓依赖闭包、verify-artifacts 断言），转正前必须从资产里删掉。
      - name: drop internal assets before publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-draft.outputs.tag }}
        run: |
          set -euo pipefail
          internal=()
          while IFS= read -r n; do
            [ -n "$n" ] && internal+=("$n")
          done < <(gh release view "$TAG" --json assets --jq '.assets[].name' |
            grep -E '^rime-sync_.*_amd64\.deb$' || true)
          if [ "${#internal[@]}" -eq 0 ]; then
            echo "没有需要删除的内部 deb 资产"
          else
            for a in "${internal[@]}"; do
              printf '删除内部资产: %s\n' "$a"
              gh release delete-asset "$TAG" "$a" --yes
            done
          fi
          # 删干净才转正：发布后用户能下载到的 Linux 资产只有 AppImage（更新用）与两个 .run。
          left=$(gh release view "$TAG" --json assets --jq '.assets[].name' | grep -cE '\.deb$' || true)
          if [ "$left" -ne 0 ]; then
            echo "::error::转正前仍有 $left 个 .deb 资产（deb 不作为发布资产）"
            exit 1
          fi

      # 草稿 → 正式：资产在上一步之前就全部到位了，这里只补 latest.json 再转正。
      # 顺序刻意是「先传 latest.json，后 --draft=false」：反过来的话会有几秒钟
      # 正式 release 可见但 latest.json 还是旧版（updater 会读到上一版的包）。
      - name: publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-draft.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/latest.json --clobber
          gh release edit "$TAG" --draft=false --notes-file dist/notes.md
          gh release view "$TAG" --json isDraft,url --jq '"draft=\(.isDraft)  \(.url)"'
          {
            echo "### 发布完成"
            echo ""
            echo "- tag：$TAG（已从草稿转正）"
            echo "- 更新清单：latest.json 与安装包在同一个 release 资产里"
          } >> "$GITHUB_STEP_SUMMARY"
