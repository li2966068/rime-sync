name: release

# 触发：推送 v* tag，或手动指定一个 tag。
# 产物：
#   linux   → deb + AppImage（+ 更新包 .AppImage.tar.gz 与 .sig）
#   windows → NSIS 安装包 + 便携版 zip（+ 更新包 .sig）
# 必需的仓库 secrets（Settings → Secrets and variables → Actions）：
#   TAURI_SIGNING_PRIVATE_KEY           更新签名私钥（minisign/tauri signer 生成）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  私钥口令（无口令可留空）
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（形如 v0.2.0，必须是已存在的 tag）"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "22"

jobs:
  linux:
    name: linux · deb + AppImage
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: install linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            file

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: fetch offline input-method deps (vendor .deb)
        timeout-minutes: 20
        run: |
          set -euo pipefail
          # ubuntu-22.04 runner 自带 docker；脚本在容器内解析 fcitx5-rime 依赖闭包。
          if ! command -v docker >/dev/null 2>&1; then
            echo "::error::runner 缺少 docker，packaging/linux/fetch-vendor-debs.sh 无法解析依赖闭包"
            exit 1
          fi
          bash packaging/linux/fetch-vendor-debs.sh || {
            echo "::error::抓取 vendor .deb 失败（需要联网 + docker）。deb 将缺少离线输入法依赖，中止发布。"
            exit 1
          }
          count=$(find packaging/linux/vendor -maxdepth 1 -name '*.deb' | wc -l)
          echo "vendor .deb 数量: $count"
          du -sh packaging/linux/vendor
          if [ "$count" -eq 0 ]; then
            echo "::error::packaging/linux/vendor 仍没有 .deb，tauri deb.files 会打进一个空目录"
            exit 1
          fi

      - name: build bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles deb,appimage

      - name: assert deb ships vendor payload (> 20 MiB)
        run: |
          shopt -s nullglob
          debs=(src-tauri/target/release/bundle/deb/*.deb)
          if [ ${#debs[@]} -eq 0 ]; then
            echo "::error::没有生成 .deb 产物"
            exit 1
          fi
          status=0
          for f in "${debs[@]}"; do
            size=$(stat -c %s "$f")
            mib=$(( size / 1024 / 1024 ))
            echo "$f: ${mib} MiB"
            if [ "$size" -lt $(( 20 * 1024 * 1024 )) ]; then
              echo "::error file=$f::deb 仅 ${mib} MiB（< 20 MiB），packaging/linux/vendor/*.deb 很可能没被打进包"
              status=1
            fi
          done
          exit $status

      - name: upload linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
            src-tauri/target/release/bundle/appimage/*.sig

  windows:
    name: windows · nsis + portable zip
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: fetch weasel installer (vendor payload)
        timeout-minutes: 15
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'packaging/windows/fetch-weasel.ps1')) {
            Write-Host '::error::缺少 packaging/windows/fetch-weasel.ps1，NSIS 无法内置 weasel 安装包'
            exit 1
          }
          pwsh -NoProfile -File packaging/windows/fetch-weasel.ps1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::packaging/windows/fetch-weasel.ps1 失败（exit $LASTEXITCODE），NSIS 将缺少 weasel 安装包"
            exit 1
          }
          $exe = Get-ChildItem -LiteralPath 'packaging/windows/vendor' -Filter 'weasel-*.exe' -ErrorAction SilentlyContinue
          if (-not $exe) {
            Write-Host '::error::packaging/windows/vendor 下没有 weasel-*.exe，resources 会打进空目录'
            exit 1
          }
          $exe | ForEach-Object { Write-Host ("vendor: {0} {1:N1} MiB" -f $_.Name, ($_.Length / 1MB)) }

      - name: build nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles nsis

      - name: build portable zip
        shell: pwsh
        run: ./packaging/portable-zip.ps1 -TargetDir src-tauri/target/release -OutDir packaging/out

      - name: upload windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*.sig
            packaging/out/*.zip

  publish:
    name: publish · 汇总产物并生成 latest.json
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: list artifacts
        run: find dist -type f -printf '%P  %s bytes\n' | sort

      - name: generate latest.json
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          python3 .github/scripts/make-latest-json.py \
            --dir dist \
            --version "$VERSION" \
            --repo "${{ github.repository }}" \
            --tag "$TAG" \
            --notes "变更见 CHANGELOG.md（${{ github.repository }}/blob/$TAG/CHANGELOG.md）" \
            --out dist/latest.json

      - name: publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "rime-sync $TAG" --generate-notes --verify-tag
          # download-artifact 保留 deb/appimage/nsis 子目录，dist/* 会把目录当文件上传。
          find dist -type f -print0 | xargs -0 gh release upload "$TAG" --clobber
