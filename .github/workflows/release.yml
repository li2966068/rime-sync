name: release

# 触发：推送 v* tag，或手动指定一个 tag。
# 产物：
#   linux   → deb + AppImage（+ 更新包 .AppImage.tar.gz 与 .sig）
#   windows → NSIS 安装包 + 便携版 zip（+ 更新包 .sig）
# 必需的仓库 secrets（Settings → Secrets and variables → Actions）：
#   TAURI_SIGNING_PRIVATE_KEY           更新签名私钥（minisign/tauri signer 生成）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  私钥口令（无口令可留空）
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（形如 v0.2.0，必须是已存在的 tag）"
        required: true
        type: string
      # 见 docs/FALLBACK-POLICY.md：回退必须显式、可见、可关闭。
      weasel_mode:
        description: "Windows 内置小狼毫的来源：auto=tag 推送强制 require；手动时取仓库变量或 build"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - require
          - build
          - fetch

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "22"

jobs:
# 触发：推送 v* tag，或手动指定一个 tag。
# 产物：
#   linux   → deb + AppImage（+ 更新包 .AppImage.tar.gz 与 .sig）
#             + 四发行版离线安装器（self-extracting .run：IME deb + 依赖闭包）
#   windows → NSIS 安装包 + 便携版 zip（+ 更新包 .sig）
  # 应用本体（deb + AppImage）。矩阵里的四个发行版 job 都复用这一个 rime-sync deb。
  linux-app:
    name: linux-app · deb + AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: free runner disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: install linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            file

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 这里刻意不抓 vendor 闭包：tauri deb 的 bundle.linux.deb.files 会把
      # packaging/linux/vendor/ 整个拷进 /usr/share/rime-sync/vendor/，四份发行版闭包
      # 会互相冲突且撑到 ~700 MiB。闭包只在 ime-<distro> 里按发行版单份使用。
      # fcitx5 配置页的「立即同步」按钮调用 /usr/bin/rime-sync-cli；CLI 不在 tauri 产物里，
      # 必须在打包前编译好并放到 deb.files 指定的位置，否则该按钮会静默 no-op。
      - name: build CLI for the deb
        timeout-minutes: 15
        run: |
          set -euo pipefail
          cargo build -p rime-sync-cli --release --locked
          install -Dm755 target/release/rime-sync-cli packaging/linux/rime-sync-cli
          file packaging/linux/rime-sync-cli

      - name: build bundles (deb + AppImage)
        timeout-minutes: 45
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles deb,appimage

      - name: assert rime-sync deb
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(src-tauri/target/release/bundle/deb/*.deb)
          if [ "${#debs[@]}" -ne 1 ]; then
            echo "::error::期望恰好 1 个 rime-sync deb，实际 ${#debs[@]} 个"
            printf '  %s\n' "${debs[@]}"
            exit 1
          fi
          deb=$(basename "${debs[0]}")
          ver=$(grep -m1 '"version"' src-tauri/tauri.conf.json | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
          case "$deb" in
            "rime-sync_${ver}_"*) : ;;
            *) echo "::error::deb 名 $deb 与 tauri.conf.json 版本 $ver 不一致"; exit 1 ;;
          esac
          echo "$deb ($(( $(stat -c %s "${debs[0]}") / 1024 / 1024 )) MiB)"

      # 单独成 artifact：矩阵的四个 job 只需要这几 MB 的 deb，不必拖 AppImage。
      - name: upload sync deb
        uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: sync-deb
          if-no-files-found: error
          path: src-tauri/target/release/bundle/deb/*.deb

      - name: upload sync appimage
        uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: sync-appimage
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
            src-tauri/target/release/bundle/appimage/*.sig

  # 四发行版各占一个 runner：镜像/闭包/.run 全部按发行版隔离，互不踩磁盘。
  # 单套实测：镜像构建 + 编译 270-310 s，闭包 2-4 min，组装 1-2 min。
  ime:
    name: ime · ${{ matrix.distro }}
    needs: linux-app
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    strategy:
      # 单个发行版失败不取消其它三个：一次跑完就能看出是哪几套坏了。
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu-22.04
            suite: jammy
            image: ubuntu:22.04
          - distro: ubuntu-24.04
            suite: noble
            image: ubuntu:24.04
          - distro: debian-12
            suite: bookworm
            image: debian:12
          - distro: debian-13
            suite: trixie
            image: debian:13
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: free runner disk space
        run: |
          set -euo pipefail
          # 一套 builder 镜像 1.1-1.7 GiB + staging + 闭包 + .run ≈ 5 GiB；还是先删预装 SDK。
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: preflight · docker + disk headroom
        run: |
          set -euo pipefail
          command -v docker >/dev/null 2>&1 || {
            echo "::error::runner 缺少 docker：scripts/ime/build-linux.sh 与 scripts/ime/fetch-vendor-deps.sh 都在容器里运行"
            exit 1
          }
          docker info >/dev/null 2>&1 || {
            echo "::error::docker daemon 不可用"
            exit 1
          }
          avail=$(df -Pk / | awk "NR==2 {print \$4}")
          avail_gib=$(( avail / 1024 / 1024 ))
          echo "docker: $(docker --version)"
          echo "可用磁盘: ${avail_gib} GiB"
          if [ "$avail_gib" -lt 8 ]; then
            echo "::error::可用磁盘仅 ${avail_gib} GiB（< 8 GiB）：单发行版构建装不下"
            exit 1
          fi

      # fetch-vendor-deps.sh / build-offline-installer.sh 的默认输入
      - name: download rime-sync deb
        uses: actions/download-artifact@v4
        with:
          name: sync-deb
          path: packaging/out
          merge-multiple: true

      - name: build input-method deb (${{ matrix.distro }})
        timeout-minutes: 20
        env:
          IMAGE: ${{ matrix.image }}
          DISTRO: ${{ matrix.distro }}
        run: |
          set -euo pipefail
          ls -l packaging/out/
          bash scripts/ime/build-linux.sh || {
            echo "::error file=scripts/ime/build-linux.sh::${DISTRO} 的输入法源码构建失败（docker build / 容器编译）"
            exit 1
          }
          f=$(ls -1t "build/deb/${DISTRO}"/rime-inputmethod_*.deb 2>/dev/null | head -n 1 || true)
          [ -n "$f" ] || { echo "::error::$DISTRO: 没有生成 rime-inputmethod deb"; exit 1; }
          echo "$DISTRO: $(basename "$f") ($(( $(stat -c %s "$f") / 1024 / 1024 )) MiB)"

      - name: fetch vendor dependency closure (${{ matrix.distro }})
        timeout-minutes: 15
        env:
          DISTRO: ${{ matrix.distro }}
        run: |
          set -euo pipefail
          bash scripts/ime/fetch-vendor-deps.sh "$DISTRO" || {
            echo "::error file=scripts/ime/fetch-vendor-deps.sh::${DISTRO} 的依赖闭包抓取失败"
            exit 1
          }
          dir=packaging/linux/vendor/$DISTRO
          n=$(find "$dir" -maxdepth 1 -name "*.deb" | wc -l)
          mib=$(du -sm "$dir" | cut -f1)
          echo "$DISTRO: $n debs, ${mib} MiB"
          if [ "$n" -lt 100 ]; then
            echo "::error::$DISTRO: vendor 闭包只有 $n 个 .deb（< 100），apt 下载很可能不完整"
            exit 1
          fi
          for f in VENDOR-INFO SHA256SUMS; do
            [ -f "$dir/$f" ] || { echo "::error::$DISTRO: 缺少 $f"; exit 1; }
          done

      - name: assemble offline installer (${{ matrix.distro }})
        timeout-minutes: 15
        env:
          DISTRO: ${{ matrix.distro }}
          SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          bash packaging/linux/build-offline-installer.sh "$DISTRO" || {
            echo "::error file=packaging/linux/build-offline-installer.sh::${DISTRO} 的 .run 组装失败"
            exit 1
          }
          ver=$(grep -m1 '"version"' src-tauri/tauri.conf.json | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
          run_file=packaging/linux/out/rime-sync-installer_${ver}~${SUITE}.run
          if [ ! -f "$run_file" ]; then
            echo "::error::缺少 $DISTRO 的离线安装器 $run_file"
            exit 1
          fi
          [ -x "$run_file" ] || { echo "::error file=$run_file::没有可执行位"; exit 1; }
          size=$(stat -c %s "$run_file")
          mib=$(( size / 1024 / 1024 ))
          echo "$run_file: ${mib} MiB"
          if [ "$size" -lt $(( 100 * 1024 * 1024 )) ]; then
            echo "::error file=$run_file::${DISTRO} 安装器仅 ${mib} MiB（< 100 MiB）：IME deb 或依赖闭包没打进去"
            exit 1
          fi
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            echo "- $DISTRO ($SUITE): $(basename "$run_file") — ${mib} MiB / vendor $(find packaging/linux/vendor/$DISTRO -name "*.deb" | wc -l) debs" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: cleanup docker images
        if: always()
        run: |
          set -uo pipefail
          docker system prune -af --volumes >/dev/null 2>&1 || true
          df -h /

      - name: upload ime artifacts (${{ matrix.distro }})
        uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: ime-${{ matrix.distro }}
          if-no-files-found: error
          # 注意：不要上传 rime-smoke（四个发行版同名，merge-multiple 后会撞名，
          # gh release upload 报 HTTP 422 Validation Failed）。
          path: |
            packaging/linux/out/*.run
            build/deb/${{ matrix.distro }}/*.deb

  # 汇总 + 验收：只有四套 .run 与四个 IME deb 都在，publish 才会被触发。
  collect:
    name: collect · 汇总并断言离线安装器
    needs: [linux-app, ime]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: list artifacts
        run: du -sh dist && find dist -type f -printf '%P  %s bytes\n' | sort

      - name: assert 4 installers + 4 input-method debs
        run: |
          set -euo pipefail
          ver=$(grep -m1 '"version"' src-tauri/tauri.conf.json | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
          status=0
          for pair in ubuntu-22.04:jammy ubuntu-24.04:noble debian-12:bookworm debian-13:trixie; do
            d=${pair%%:*}
            suite=${pair##*:}
            run_file=dist/packaging/linux/out/rime-sync-installer_${ver}~${suite}.run
            if [ ! -f "$run_file" ]; then
              echo "::error::缺少 $d 的离线安装器（$run_file）"
              status=1
            else
              size=$(stat -c %s "$run_file")
              mib=$(( size / 1024 / 1024 ))
              echo "$run_file: ${mib} MiB"
              if [ "$size" -lt $(( 100 * 1024 * 1024 )) ]; then
                echo "::error file=$run_file::${d} 安装器仅 ${mib} MiB（< 100 MiB）"
                status=1
              fi
            fi
            ime=$(ls -1 dist/build/deb/"$d"/rime-inputmethod_*.deb 2>/dev/null | head -n 1 || true)
            if [ -n "$ime" ]; then
              echo "$ime: $(( $(stat -c %s "$ime") / 1024 / 1024 )) MiB"
            else
              echo "::error::缺少 $d 的 rime-inputmethod deb"
              status=1
            fi
          done
          for f in "dist/rime-sync_${ver}_amd64.deb" "dist/rime-sync_${ver}_amd64.AppImage"; do
            [ -f "$f" ] || { echo "::error::缺少 $f"; status=1; }
          done
          exit $status

      - name: upload linux bundles
        uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: linux-bundles
          if-no-files-found: error
          path: dist/**

  windows:
    name: windows · nsis + portable zip
    # 固定 2022：脚本的前提是 VS2022 + v143 + boost 1.84（windows-latest 会跟着微软迁移，
    # 迁移当天工具集/boost 探测会一起漂移）。要换 runner 请先跑一遍 build-weasel.ps1 -Check。
    runs-on: windows-2022
    outputs:
      weasel_mode: ${{ steps.weasel_mode.outputs.mode }}
      weasel_source: ${{ steps.weasel_verify.outputs.source }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # 模式解析（唯一真源）：
      #   tag 推送              → require：自编译失败直接让 job 失败，绝不用上游包顶替
      #   手动 workflow_dispatch → inputs.weasel_mode（auto 时取仓库变量 vars.RIMESYNC_WEASEL_MODE，缺省 build）
      # build 允许回退，但产物里带 WEASEL-SOURCE.json 标记，publish 用它写红字发布说明。
      - name: resolve weasel mode
        id: weasel_mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.weasel_mode }}
          REPO_VAR: ${{ vars.RIMESYNC_WEASEL_MODE }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            mode=require
            source_note="tag 推送强制 require"
          else
            case "$INPUT_MODE" in
              "" | auto) mode="${REPO_VAR:-build}" ;;
              *) mode="$INPUT_MODE" ;;
            esac
            source_note="手动触发 inputs.weasel_mode=$INPUT_MODE"
          fi
          case "$mode" in
            require | build | fetch) : ;;
            *)
              echo "::error::未知的 Weasel 模式：$mode（只接受 require|build|fetch）"
              exit 1
              ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "RIMESYNC_WEASEL_MODE=$mode" >> "$GITHUB_ENV"
          echo "weasel mode: $mode（$source_note）"
          {
            echo "### Weasel 模式：$mode"
            echo ""
            case "$mode" in
              require) echo "- 自编译失败 = 本 job 失败，不允许回退上游官方安装包。" ;;
              build) echo "- 自编译失败会回退上游官方安装包：**本版将不带「Rime 同步」入口**，发布说明与 summary 会红字标注。" ;;
              fetch) echo "- 直接使用上游官方安装包：**本版不带「Rime 同步」入口**（显式选择，仍会红字标注）。" ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 缓存四件套：
      #   boost/ + stage/   命中就直接跳过下载/bootstrap/b2（日志会打印「来源=cache」）
      #   b2.exe            源码/头文件在、但 b2 丢了时不用重跑 bootstrap
      #   boost_1_84_0.7z   失败重跑时不必再从 archives.boost.io 拉 120 MB
      # key 含 build-weasel.ps1 的哈希：脚本一改就换 key，但 restore-keys 会捞上一次的同名缓存，
      # 所以调试期间不会每次都从零编译。
      - name: cache weasel build deps (boost 1.84.0)
        if: steps.weasel_mode.outputs.mode != 'fetch'
        uses: actions/cache@v4
        with:
          path: |
            third_party/weasel/deps/boost_1_84_0/boost
            third_party/weasel/deps/boost_1_84_0/stage
            third_party/weasel/deps/boost_1_84_0/b2.exe
            third_party/weasel/deps/boost_1_84_0/project-config.jam
            third_party/weasel/deps/boost_1_84_0.7z
          key: ${{ runner.os }}-weasel-boost-1.84.0-${{ hashFiles('scripts/ime/build-weasel.ps1', 'third_party/weasel/weasel.sln') }}
          restore-keys: |
            ${{ runner.os }}-weasel-boost-1.84.0-

      # 先在 1 分钟内把工具链看清楚，再进 90 分钟的自编译。
      # -Check 不下载、不编译，只打印 repo root/VS/cl.exe/b2/boost 状态；
      # v0.6.1 的失败点（bootstrap 探测不到工具集）在这里就会以「cl.exe = ok」+ VS 路径暴露。
      - name: preflight · weasel toolchain（VS2022 / v143 / boost 缓存）
        if: steps.weasel_mode.outputs.mode != 'fetch'
        timeout-minutes: 10
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/ime/build-weasel.ps1 -Check
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::build-weasel.ps1 -Check 失败（exit $LASTEXITCODE）：VS 工具链或 vendored 源码不完整"
            exit $LASTEXITCODE
          }

      # 从 vendored 源码（third_party/weasel = rime/weasel 0.17.4）编译 Weasel 安装包。
      # 依赖：VS2022/v143 + boost 1.84.0（脚本自建/缓存）+ librime 预编译包（get-rime.ps1）
      #       + NSIS 3.08（脚本自动安装）。脚本内部会做产物断言。
      #
      # boost 的取法（v0.6.1 就死在这一步）：
      #   脚本现在固定 `call bootstrap.bat vc143`，并把 VSINSTALLDIR/VCINSTALLDIR/VS170COMNTOOLS
      #   显式喂进 dev shell。原因：boost 1.84 的 bootstrap 不带 toolset 时会走 guess_toolset.bat，
      #   那里只认 VS2017 路径，VS2022-only 的 runner 上必然报
      #   "### unable to detect your toolset installation" 然后 exit 1。
      #   不要改用 SourceForge 的预编译包：它是 /MD，Weasel 是 /MT，链接会硬失败（LNK1104/LNK2038）。
      # require（tag 发布）：失败即本 job 失败，**不回退**（v0.6.0 事故的根因就是这里静默回退了）。
      # build/fetch（手动）：失败只让本步骤红，下一步回退上游官方包，但会在 summary / 发布说明红字标注。
      - name: build weasel installer from vendored source
        id: weasel_selfbuild
        if: steps.weasel_mode.outputs.mode != 'fetch'
        continue-on-error: ${{ steps.weasel_mode.outputs.mode != 'require' }}
        timeout-minutes: 90
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEASEL_MODE: ${{ steps.weasel_mode.outputs.mode }}
        run: |
          pwsh -NoProfile -File scripts/ime/build-weasel.ps1 -LibrimeTag 1.13.1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::build-weasel.ps1 失败（exit $LASTEXITCODE；模式 $env:WEASEL_MODE）：require=本 job 失败，build/fetch=回退上游安装包"
            exit $LASTEXITCODE
          }
          $exe = Get-Item -LiteralPath 'packaging/windows/vendor/weasel-0.17.4.0-installer.exe'
          Write-Host ("self-built weasel: {0:N1} MiB" -f ($exe.Length / 1MB))

      # 只有自编译失败时才跑：把 VS 安装 / cl.exe / boost 目录状态一次性打到日志里。
      # v0.6.1 的日志里只有 "unable to detect your toolset installation" 这一句猜谜；
      # 下一次失败应该能从日志直接读出「哪份 VS、有没有 cl、b2 在不在、boost 源码树齐不齐」。
      - name: dump toolchain diagnostics (self-build failed)
        if: steps.weasel_selfbuild.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Host '==== vswhere installations ===='
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (Test-Path -LiteralPath $vswhere) {
            & $vswhere -all -products '*' -property installationPath
            & $vswhere -all -products '*' -property installationVersion
          } else {
            Write-Host "vswhere 不存在：$vswhere"
          }
          Write-Host '==== boost tree ===='
          $root = 'third_party/weasel/deps/boost_1_84_0'
          Get-ChildItem -LiteralPath $root -ErrorAction SilentlyContinue |
            Select-Object Mode, Length, Name | Format-Table -AutoSize | Out-String | Write-Host
          Write-Host ('b2.exe = ' + (Test-Path -LiteralPath (Join-Path $root 'b2.exe')))
          Write-Host ('bootstrap.bat = ' + (Test-Path -LiteralPath (Join-Path $root 'bootstrap.bat')))
          $lib = Join-Path $root 'stage/lib'
          if (Test-Path -LiteralPath $lib) {
            Get-ChildItem -LiteralPath $lib -Filter 'libboost_filesystem-*.lib' | Select-Object -ExpandProperty Name
          }
          Write-Host '==== preflight (-Check) ===='
          pwsh -NoProfile -File scripts/ime/build-weasel.ps1 -Check
          exit 0

      # 离线兜底：fetch-weasel.ps1 仍然保留，下载并校验上游官方安装包（大小 + SHA-256）。
      # 触发条件：显式 mode=fetch（或手动选了 build 且自编译失败）。
      # require 模式下这一步永远不跑：上一步失败已经让 job 红了。
      - name: fetch upstream weasel installer (fallback / offline mode)
        if: steps.weasel_mode.outputs.mode != 'require' && (steps.weasel_mode.outputs.mode == 'fetch' || steps.weasel_selfbuild.outcome == 'failure')
        timeout-minutes: 15
        shell: pwsh
        run: |
          if ('${{ steps.weasel_selfbuild.outcome }}' -eq 'failure') {
            Write-Host '::error title=Weasel 回退::自编译 Weasel 失败，回退上游官方安装包：本版 Windows 版将没有「Rime 同步…」入口（已写进 summary 与发布说明）'
          } else {
            Write-Host '::error title=Weasel 回退::RIMESYNC_WEASEL_MODE=fetch：直接使用上游官方安装包，本版没有「Rime 同步…」入口'
          }
          if ($env:GITHUB_STEP_SUMMARY) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value @(
              '> [!CAUTION]',
              '> **本版未包含 Weasel 入口**（上游官方 Weasel 回退）。',
              '> 规则见 docs/FALLBACK-POLICY.md。'
            )
          }
          if (-not (Test-Path -LiteralPath 'packaging/windows/fetch-weasel.ps1')) {
            Write-Host '::error::缺少 packaging/windows/fetch-weasel.ps1（兜底路径不可用）'
            exit 1
          }
          pwsh -NoProfile -File packaging/windows/fetch-weasel.ps1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::fetch-weasel.ps1 失败（exit $LASTEXITCODE）"
            exit $LASTEXITCODE
          }

      # 验收：内嵌的 Weasel 必须真的来自我们自己编译的源码。
      # require 模式下自编译失败 = 本 job 失败（绝不静默回退）。
      # 回退时写 packaging/out/WEASEL-SOURCE.json：publish 用它写红字发布说明，
      # verify-artifacts 用它决定是否放行「WeaselServer.exe 里没有 Rime 同步」。
      - name: verify weasel vendor payload
        id: weasel_verify
        shell: pwsh
        env:
          WEASEL_MODE: ${{ steps.weasel_mode.outputs.mode }}
        run: |
          $exe = Get-ChildItem -LiteralPath 'packaging/windows/vendor' -Filter 'weasel-*.exe' -File -ErrorAction SilentlyContinue |
            Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe) {
            Write-Host '::error::packaging/windows/vendor 下没有 weasel-*.exe，NSIS 安装包里不会有输入法'
            exit 1
          }
          $mib = [math]::Round($exe.Length / 1MB, 1)
          Write-Host "vendor: $($exe.Name) $mib MiB"
          if ($exe.Length -lt 10MB) {
            Write-Host "::error::weasel 安装包只有 $mib MiB（< 10 MiB），疑似下载/构建不完整"
            exit 1
          }

          $mode = $env:WEASEL_MODE
          $selfbuilt = '${{ steps.weasel_selfbuild.outcome }}'
          $source = 'upstream'
          if ($selfbuilt -eq 'success') { $source = 'self-built' }

          if ($mode -eq 'require' -and $source -ne 'self-built') {
            Write-Host "::error title=Weasel 自编译失败::RIMESYNC_WEASEL_MODE=require：自编译 Weasel 失败（outcome=$selfbuilt），本版不允许回退上游官方安装包；请修 scripts/ime/build-weasel.ps1"
            exit 1
          }

          $marker = 'packaging/out/WEASEL-SOURCE.json'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $marker) | Out-Null
          $payload = [ordered]@{
            mode              = $mode
            source            = $source
            selfbuild_outcome = $selfbuilt
            installer         = $exe.Name
            installer_bytes   = $exe.Length
            caption           = 'Rime 同步'
            written_at        = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          }
          $payload | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $marker -Encoding utf8
          Write-Host "weasel source: $source（mode=$mode）"
          Write-Host "marker: $marker"
          "source=$source" >> $env:GITHUB_OUTPUT

          if ($env:GITHUB_STEP_SUMMARY) {
            if ($source -eq 'self-built') {
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value (
                "- Weasel 安装器：{0}（{1} MiB，来源：自编译 third_party/weasel @ 0.17.4，模式 {2}）" -f $exe.Name, $mib, $mode)
            } else {
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value @(
                '> [!CAUTION]',
                ('> **本版未包含 Weasel 入口**：Windows 安装包用的是上游官方 Weasel（自编译 outcome=' + $selfbuilt + '，模式 ' + $mode + '）。'),
                '> 「Rime 同步…」菜单项不存在；规则见 docs/FALLBACK-POLICY.md。'
              )
            }
          }

      - name: build nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles nsis

      # 验收断言：最终 setup.exe ≥ 15 MiB（内嵌的 Weasel 安装器约 12 MiB，未被 LZMA 压没）。
      - name: assert nsis setup embeds weasel
        shell: pwsh
        run: |
          $setup = Get-ChildItem -LiteralPath 'src-tauri/target/release/bundle/nsis' -Filter '*-setup.exe' -File -ErrorAction SilentlyContinue |
            Sort-Object Length -Descending | Select-Object -First 1
          if (-not $setup) {
            Write-Host '::error::没找到 NSIS 安装包（src-tauri/target/release/bundle/nsis/*-setup.exe）'
            exit 1
          }
          $mib = [math]::Round($setup.Length / 1MB, 1)
          Write-Host "NSIS setup: $($setup.Name) $mib MiB"
          if ($setup.Length -lt 15MB) {
            Write-Host "::error::NSIS 安装包只有 $mib MiB（< 15 MiB）：内置 Weasel 很可能没打进去。"
            Write-Host "检查 packaging/windows/vendor/weasel-*.exe 是否存在，以及 makensis 日志里"
            Write-Host "是否有 'NSIS_HOOK_PREINSTALL' 相关告警（packaging/nsis-hooks.nsh 的 !warning）。"
            exit 1
          }

      - name: build portable zip
        shell: pwsh
        run: ./packaging/portable-zip.ps1 -TargetDir src-tauri/target/release -OutDir packaging/out

      - name: upload windows artifacts
        uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: windows-bundles
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*.sig
            packaging/out/*.zip
            # Weasel 来源标记：publish 据此写红字发布说明，verify-artifacts 据此放行/拒绝回退产物。
            packaging/out/WEASEL-SOURCE.json

  # 产物验收：把"用户能看见的功能入口"变成断言（v0.6.0 事故的直接防线）。
  # 失败就不发布：publish 依赖本 job。
  verify-artifacts:
    name: verify-artifacts · 功能入口断言
    needs: [collect, windows]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: download built artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-bundles"
          path: dist
          merge-multiple: true

      - name: install extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      # Weasel 严格程度由 windows job 解析出的模式决定：
      # require → WeaselServer.exe 里必须有「Rime 同步」，否则失败；
      # build/fetch → 允许上游回退，但 summary/发布说明红字标注。
      - name: verify artifacts
        env:
          WEASEL_MODE: ${{ needs.windows.outputs.weasel_mode }}
        run: |
          set -euo pipefail
          echo "Weasel 模式：${WEASEL_MODE:-require}"
          find dist -maxdepth 5 -type f -printf '%P  %s bytes\n' | sort | sed -n '1,60p'
          bash .github/scripts/verify-artifacts.sh --dir dist --weasel-mode "${WEASEL_MODE:-require}"

  publish:
    name: publish · 汇总产物并生成 latest.json
    needs: [collect, windows, verify-artifacts]
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          # 只取 collect / windows 的最终产物：sync-deb、sync-appimage、ime-<distro>
          # 是构建期的中间 artifact（不匹配 *-bundles），不必在这里重复下载。
          pattern: "*-bundles"
          path: dist
          merge-multiple: true

      - name: list artifacts
        run: find dist -type f -printf '%P  %s bytes\n' | sort

      - name: generate release notes
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          # 更新提示直接用 CHANGELOG 的中文段落（用户要求：提示里显示本版更新内容）。
          python3 .github/scripts/changelog-notes.py --version "$VERSION" --out dist/notes.md

      # docs/FALLBACK-POLICY.md：任何回退必须在发布说明里可见。
      # WEASEL-SOURCE.json 由 windows job 写出并随 windows-bundles 上传。
      - name: disclose weasel fallback
        run: |
          set -euo pipefail
          # upload-artifact 保留相对仓库根的子目录（例如 packaging/out/），所以不能假定它在 dist 根下。
          marker=$(find dist -name 'WEASEL-SOURCE.json' -type f | sort | sed -n '1p')
          if [ -z "$marker" ] || [ ! -f "$marker" ]; then
            echo "::error title=Weasel 来源未知::dist 里没有 WEASEL-SOURCE.json，无法确认本版是否带「Rime 同步」入口"
            exit 1
          fi
          echo "weasel marker: $marker"
          python3 - "$marker" > dist/weasel-warning.md <<'PY'
          import json
          import sys

          # Windows 侧 Set-Content 可能带 BOM，utf-8-sig 两种情况都能读。
          data = json.load(open(sys.argv[1], encoding="utf-8-sig"))
          if data.get("source") == "self-built":
              sys.exit(0)
          print("> [!CAUTION]")
          print("> **本版未包含 Weasel 入口**（Windows 安装包里没有「Rime 同步…」菜单项）。")
          print(">")
          print(f"> Weasel 安装器来源：{data.get('installer', '?')}"
                f"（self-build outcome={data.get('selfbuild_outcome', '?')}，"
                f"模式 {data.get('mode', '?')}）。")
          print(">")
          print("> 规则见 docs/FALLBACK-POLICY.md；修复后重跑构建即恢复入口。")
          PY
          if [ -s dist/weasel-warning.md ]; then
            cat dist/weasel-warning.md dist/notes.md > dist/notes.new
            mv dist/notes.new dist/notes.md
            {
              echo "## Weasel 回退（发布说明已红字标注）"
              echo ""
              cat dist/weasel-warning.md
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Weasel 回退::本版未包含 Weasel 入口，已在发布说明顶部标注"
          else
            echo "Weasel 来源：自编译（发布说明无需告警）"
            echo "- Weasel：自编译，入口完整" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: generate latest.json
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          python3 .github/scripts/make-latest-json.py \
            --dir dist \
            --version "$VERSION" \
            --repo "${{ github.repository }}" \
            --tag "$TAG" \
            --notes-file dist/notes.md \
            --out dist/latest.json

      - name: publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file dist/notes.md
          else
            gh release create "$TAG" --title "rime-sync $TAG" --notes-file dist/notes.md --verify-tag
          fi
          # download-artifact 保留 deb/appimage/nsis 子目录，dist/* 会把目录当文件上传。
          find dist -type f -print0 | xargs -0 gh release upload "$TAG" --clobber

      # Artifact 配额很小，发布完立刻删掉本次运行的中间产物；
      # 配合 upload-artifact 的 retention-days: 1，避免再次撑爆配额。
      - name: prune run artifacts
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          ids=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[].id' 2>/dev/null || true)
          for id in $ids; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" >/dev/null 2>&1 || true
          done
          echo "pruned artifacts"

      # Artifact 配额很小，发布完立刻删掉本次运行的中间产物；
      # 配合 upload-artifact 的 retention-days: 1，避免再次撑爆配额。
      - name: prune run artifacts
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          ids=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[].id' 2>/dev/null || true)
          for id in $ids; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" >/dev/null 2>&1 || true
          done
          echo "pruned artifacts"
