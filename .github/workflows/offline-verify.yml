name: offline-verify

# 手动回归：把 trixie 的两个安装器真装一遍（容器内安装 + 断言）。
#   full -> docker run --network none：断网安装必须成功
#   thin -> 断网必须失败并提示改用全量包；联网必须安装成功
# 不进 tag 触发的发布路径：单次约 60-90 分钟，只用于发版前/改动安装器后的人工验收。
# 产物证据：build/evidence/<distro>/{test-image.log,*install.log,sizes.txt} + SIZES.txt。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "要验证的 ref（分支 / tag / SHA）"
        required: false
        default: master
        type: string
      distros:
        description: "要验证的发行版（留空=debian-13：Linux 只出 trixie）"
        required: false
        default: ""
        type: string
      skip_thin_online:
        description: "跳过 thin 包的联网安装（默认 false：断网失败路径 + 联网成功路径都验）"
        required: false
        default: "false"
        type: string

concurrency:
  group: offline-verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "22"

jobs:
  verify-offline:
    name: offline install · verify-offline.sh
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: free runner disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: preflight · docker + disk headroom
        run: |
          set -euo pipefail
          command -v docker >/dev/null 2>&1 || {
            echo "::error::runner 缺少 docker：verify-offline.sh 在容器里安装并断言"
            exit 1
          }
          docker info >/dev/null 2>&1 || {
            echo "::error::docker daemon 不可用"
            exit 1
          }
          avail=$(df -Pk / | awk "NR==2 {print \$4}")
          avail_gib=$(( avail / 1024 / 1024 ))
          echo "可用磁盘: ${avail_gib} GiB"
          if [ "$avail_gib" -lt 12 ]; then
            echo "::error::可用磁盘仅 ${avail_gib} GiB（< 12 GiB）：trixie 构建镜像 + 测试镜像装不下"
            exit 1
          fi

      - name: install linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            file

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      # bundle.externalBin 需要 <路径>-<host triple> 的源文件；离线回归只出 deb，
      # 但 tauri build 仍会检查 sidecar，缺了直接失败（与 release.yml 的 linux-app 一致）。
      - name: build CLI sidecar
        timeout-minutes: 15
        run: |
          set -euo pipefail
          cargo build -p rime-sync-cli --release --locked
          triple=$(rustc -vV | sed -n 's/^host: //p')
          [ -n "$triple" ] || { echo "::error::rustc -vV 里没有 host triple"; exit 1; }
          install -Dm755 target/release/rime-sync-cli "target/release/rime-sync-cli-$triple"
          file "target/release/rime-sync-cli-$triple"

      # 只出 deb（回归只关心离线安装器），且必须先于 fetch-vendor-deps.sh：
      # 否则 deb 会把 packaging/linux/vendor/ 整个吞进 /usr/share/rime-sync/vendor/。
      - name: build rime-sync deb
        timeout-minutes: 45
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles deb

      - name: stage rime-sync deb for offline bundles
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(src-tauri/target/release/bundle/deb/*.deb)
          if [ "${#debs[@]}" -ne 1 ]; then
            echo "::error::期望恰好 1 个 rime-sync deb，实际 ${#debs[@]} 个"
            exit 1
          fi
          mkdir -p packaging/out
          cp -f "${debs[0]}" packaging/out/
          echo "offline bundle 输入: packaging/out/$(basename "${debs[0]}")"

      - name: build input-method deb (docker, trixie only)
        timeout-minutes: 60
        run: |
          set -euo pipefail
          rc=0
          ALL=1 bash scripts/ime/build-linux.sh || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::scripts/ime/build-linux.sh ALL=1 失败（exit $rc）"
            compgen -G "build/deb/debian-13/rime-inputmethod_*.deb" >/dev/null || \
              echo "::error file=scripts/ime/build-linux.sh::debian-13 的 rime-inputmethod deb 未生成"
            exit "$rc"
          fi
          du -sh build/deb

      - name: free disk after IME build
        if: always()
        run: |
          set -uo pipefail
          rm -rf build/ime-staging || true
          docker system prune -af --volumes >/dev/null 2>&1 || true
          df -h /

      - name: fetch full-installer dependency closure (trixie)
        timeout-minutes: 40
        run: |
          set -euo pipefail
          bash scripts/ime/fetch-vendor-deps.sh || {
            echo "::error::scripts/ime/fetch-vendor-deps.sh 失败（见上方日志）"
            exit 1
          }
          dir=packaging/linux/vendor/debian-13
          n=$(find "$dir" -maxdepth 1 -name "*.deb" 2>/dev/null | wc -l)
          echo "debian-13: $n debs"
          [ "$n" -ge 100 ] || { echo "::error::debian-13: vendor 闭包只有 $n 个 .deb（< 100）"; exit 1; }

      - name: free disk before assembling .run
        run: |
          set -uo pipefail
          docker system prune -af --volumes >/dev/null 2>&1 || true
          df -h /

      - name: assemble installers · full + thin (trixie)
        timeout-minutes: 30
        run: |
          set -euo pipefail
          # --both：全量（内置依赖闭包）+ 非全量（apt 装依赖），两者都是 IME + 同步工具。
          bash packaging/linux/build-offline-installer.sh --both debian-13 || {
            echo "::error::packaging/linux/build-offline-installer.sh 失败（见上方日志）"
            exit 1
          }

      # 真正的验收：trixie 建一个测试镜像，分别验 full（断网安装成功）与
      # thin（断网必须明确失败 + 联网必须成功）。
      - name: verify installers (full offline + thin offline/online)
        timeout-minutes: 90
        env:
          DISTROS: ${{ inputs.distros }}
          SKIP_THIN_ONLINE: ${{ inputs.skip_thin_online }}
        run: |
          set -euo pipefail
          read -r -a wanted <<< "$DISTROS"
          if [ "${#wanted[@]}" -eq 0 ]; then
            wanted=(debian-13)
          fi
          echo "verifying: ${wanted[*]}"
          args=()
          [ "$SKIP_THIN_ONLINE" = "true" ] && args+=(--skip-online)
          bash packaging/linux/verify-offline.sh "${args[@]}" "${wanted[@]}" || {
            echo "::error::packaging/linux/verify-offline.sh 失败：安装断言未通过（证据见 build/evidence）"
            exit 1
          }

      - name: upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-evidence
          if-no-files-found: warn
          path: |
            build/evidence/**

      - name: summary
        if: always()
        run: |
          if [ -f build/evidence/SIZES.txt ]; then
            {
              echo "## 离线安装回归（$(date -u +%Y-%m-%dT%H:%M:%SZ)）"
              echo
              echo "```"
              cat build/evidence/SIZES.txt
              echo "```"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
